<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vocab Game | ENG-LEARN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }
        body {
            min-height: 100vh;
            padding: 1.5rem;
            background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
        }
        .max-w-3xl {
            max-width: 48rem;
            margin-left: auto;
            margin-right: auto;
        }

        /* Timer progress bar */
        .timer-bar {
            height: 6px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            transition: width 0.3s ease;
        }
        .timer-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
            border-radius: 4px;
            width: 100%;
            transition: width 0.3s linear;
        }

        /* Skor & streak */
        .badge-score {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            border: 2px solid #fff;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        /* Opsi pilihan */
        .option-btn {
            transition: all 0.2s ease;
            border: 2px solid #e5e7eb;
            background: white;
            padding: 16px 12px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1rem;
            min-height: 56px;
            text-align: center;
            cursor: pointer;
        }
        .option-btn:hover {
            border-color: #818cf8;
            background: #f8faff;
        }
        .option-btn.selected {
            border-color: #6366f1;
            background: #eef2ff;
        }
        .option-btn.correct {
            border-color: #22c55e;
            background: #dcfce7;
        }
        .option-btn.wrong {
            border-color: #ef4444;
            background: #fee2e2;
        }
        .option-btn:active {
            transform: scale(0.96);
        }
        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .option-btn {
                font-size: 0.9rem;
                padding: 14px 10px;
                min-height: 52px;
            }
            .grid-cols-1.md\:grid-cols-2 {
                grid-template-columns: 1fr 1fr !important;
                gap: 10px !important;
            }
            .bg-white.rounded-3xl {
                padding: 16px !important;
            }
            #tombolLanjut,
            #tombolSelesai {
                padding: 16px !important;
                font-size: 1rem !important;
                min-height: 56px !important;
            }
            .max-w-3xl.mx-auto.mb-6.flex.justify-between {
                flex-wrap: wrap !important;
                gap: 12px !important;
            }
            #teksSoal {
                font-size: 1.2rem !important;
            }
        }

        /* Animasi fade */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        .delay-1 {
            animation-delay: 0.1s;
            opacity: 0;
        }
        .delay-2 {
            animation-delay: 0.2s;
            opacity: 0;
        }

        /* Tombol kembali */
        .btn-back {
            background: white;
            border-radius: 12px;
            padding: 8px 16px;
            font-weight: 600;
            color: #4f46e5;
            border: 2px solid #e0e7ff;
            transition: all 0.2s;
        }
        .btn-back:hover {
            background: #eef2ff;
            border-color: #818cf8;
        }
    </style>
</head>
<body>

    <div class="max-w-3xl mx-auto">

        <!-- TOP BAR -->
        <div class="mb-6 flex justify-between items-center">
            <a href="index.html" class="btn-back inline-flex items-center gap-1">
                ⬅️ Kembali
            </a>
            <div class="bg-indigo-600 text-white font-bold px-6 py-2 rounded-xl shadow-md flex items-center gap-2 text-lg">
                ⭐ Poin Total: <span id="poinTotal">0</span>
            </div>
        </div>

        <!-- KARTU GAME -->
        <div class="bg-white rounded-3xl p-8 shadow-xl border-2 border-indigo-100">

            <!-- Header Game -->
            <div class="flex justify-between items-center mb-4 border-b-2 border-indigo-100 pb-4">
                <h1 class="text-2xl font-extrabold text-gray-800 flex items-center gap-2">
                    🎮 Vocab <span class="text-indigo-600">Quiz</span>
                </h1>
                <span id="labelNomorSoal" class="bg-indigo-100 text-indigo-700 font-bold px-4 py-1 rounded-full text-sm">
                    Soal 1 dari 10
                </span>
            </div>

            <!-- Skor & Streak (badge) -->
            <div class="flex flex-wrap gap-4 mb-6 text-sm">
                <div class="badge-score rounded-xl px-4 py-2 flex items-center gap-2">
                    🏆 Skor: <span id="skorSesi" class="font-bold text-indigo-600">0</span>
                </div>
                <div class="badge-score rounded-xl px-4 py-2 flex items-center gap-2">
                    🔥 Streak: <span id="streak" class="font-bold text-orange-500">0</span>
                </div>
                <div class="badge-score rounded-xl px-4 py-2 flex items-center gap-2">
                    ⏱️ <span id="timerDisplay" class="font-bold text-red-500">15</span>s
                </div>
            </div>

            <!-- Timer Progress Bar -->
            <div class="timer-bar mb-6">
                <div id="timerFill" class="timer-bar-fill" style="width: 100%;"></div>
            </div>

            <!-- Kata & Opsi -->
            <div id="areaSoal" class="fade-in">
                <div id="teksSoal" class="text-3xl font-extrabold text-center text-gray-800 mb-6">
                    Loading...
                </div>

                <div id="areaPilihan" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <!-- Opsi dimuat via JS -->
                </div>
            </div>

            <!-- Tombol Lanjut / Selesai -->
            <button id="tombolLanjut" onclick="soalBerikutnya()" class="hidden w-full bg-green-500 text-white px-6 py-4 rounded-xl font-bold text-lg hover:bg-green-600 shadow-md transition-colors">
                ➡️ Lanjut Soal Berikutnya
            </button>

            <button id="tombolSelesai" onclick="simpanPoinDanSelesai()" class="hidden w-full bg-indigo-600 text-white px-6 py-4 rounded-xl font-bold text-lg hover:bg-indigo-700 shadow-md transition-colors">
                🎉 Selesai! Simpan Poin
            </button>

            <!-- Pesan Hasil (feedback) -->
            <div id="pesanHasil" class="hidden mt-4 p-4 rounded-xl border-2 text-center font-bold text-lg"></div>

        </div>
    </div>

    <script>
        // ============================================================
        //  DATA KOSAKATA (40 kata umum untuk SMP/SMA)
        // ============================================================
        const vocabData = [
            { word: "abandon", meaning: "meninggalkan" },
            { word: "ability", meaning: "kemampuan" },
            { word: "abroad", meaning: "di luar negeri" },
            { word: "absorb", meaning: "menyerap" },
            { word: "accelerate", meaning: "mempercepat" },
            { word: "accomplish", meaning: "mencapai" },
            { word: "accurate", meaning: "akurat" },
            { word: "achieve", meaning: "mencapai" },
            { word: "acquire", meaning: "memperoleh" },
            { word: "adapt", meaning: "beradaptasi" },
            { word: "adjust", meaning: "menyesuaikan" },
            { word: "admire", meaning: "mengagumi" },
            { word: "admit", meaning: "mengakui" },
            { word: "adopt", meaning: "mengadopsi" },
            { word: "advance", meaning: "kemajuan" },
            { word: "advise", meaning: "menasihati" },
            { word: "affect", meaning: "mempengaruhi" },
            { word: "afford", meaning: "mampu" },
            { word: "aggressive", meaning: "agresif" },
            { word: "agree", meaning: "setuju" },
            { word: "allow", meaning: "mengizinkan" },
            { word: "amaze", meaning: "mengagumkan" },
            { word: "analyze", meaning: "menganalisis" },
            { word: "announce", meaning: "mengumumkan" },
            { word: "anxious", meaning: "cemas" },
            { word: "apologize", meaning: "meminta maaf" },
            { word: "appear", meaning: "muncul" },
            { word: "appreciate", meaning: "menghargai" },
            { word: "approach", meaning: "pendekatan" },
            { word: "assume", meaning: "berasumsi" },
            { word: "attract", meaning: "menarik" },
            { word: "avoid", meaning: "menghindari" },
            { word: "aware", meaning: "sadar" },
            { word: "balance", meaning: "keseimbangan" },
            { word: "barrier", meaning: "hambatan" },
            { word: "behavior", meaning: "perilaku" },
            { word: "benefit", meaning: "manfaat" },
            { word: "blame", meaning: "menyalahkan" },
            { word: "boost", meaning: "meningkatkan" },
            { word: "brief", meaning: "singkat" }
        ];

        // ============================================================
        //  STATE GAME
        // ============================================================
        let sesiSoal = [];
        let indeksAktif = 0;
        let skorSesi = 0;
        let streakSesi = 0;
        let timerInterval = null;
        let waktuTersisa = 15;
        let sudahDijawab = false;
        let totalPoinLama = 0;
        const MAX_SOAL = 10;
        const WAKTU_PER_SOAL = 15;

        // ============================================================
        //  FUNGSI UTAMA
        // ============================================================

        // Ambil 10 soal acak dari vocabData
        function ambilSoalAcak() {
            const shuffled = [...vocabData];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled.slice(0, MAX_SOAL);
        }

        // Buat pilihan (1 benar + 3 salah acak dari data)
        function buatPilihan(soal) {
            const semuaArti = vocabData.map(v => v.meaning);
            const filtered = semuaArti.filter(m => m !== soal.meaning);
            const shuffled = filtered.sort(() => Math.random() - 0.5);
            const pilihan = [soal.meaning, ...shuffled.slice(0, 3)];
            return pilihan.sort(() => Math.random() - 0.5);
        }

        // Muat soal ke tampilan
        function muatSoal() {
            if (indeksAktif >= sesiSoal.length) {
                // Semua selesai
                document.getElementById("tombolLanjut").classList.add("hidden");
                document.getElementById("tombolSelesai").classList.remove("hidden");
                document.getElementById("areaSoal").classList.add("hidden");
                document.getElementById("pesanHasil").classList.remove("hidden");
                document.getElementById("pesanHasil").innerHTML = `
                    🎉 <b>Semua soal selesai!</b><br />
                    Skor akhir: <span class="text-indigo-600 text-2xl">${skorSesi}</span> poin
                `;
                document.getElementById("pesanHasil").className =
                    "mt-4 p-4 rounded-xl border-2 border-indigo-200 bg-indigo-50 text-gray-700 text-center font-bold text-lg";
                stopTimer();
                return;
            }

            const soal = sesiSoal[indeksAktif];
            const pilihan = buatPilihan(soal);

            document.getElementById("labelNomorSoal").innerHTML = `Soal ${indeksAktif + 1} dari ${MAX_SOAL}`;
            document.getElementById("teksSoal").innerHTML = `<span class="text-indigo-600">Pilih arti dari:</span><br />"${soal.word}"`;

            // Render opsi
            const areaPilihan = document.getElementById("areaPilihan");
            areaPilihan.innerHTML = "";
            pilihan.forEach((opsi) => {
                const btn = document.createElement("button");
                btn.innerHTML = opsi;
                btn.className = "option-btn";
                btn.dataset.value = opsi;
                btn.onclick = function() { pilihJawaban(this, opsi, soal.meaning); };
                areaPilihan.appendChild(btn);
            });

            // Reset state
            sudahDijawab = false;
            document.getElementById("pesanHasil").classList.add("hidden");
            document.getElementById("tombolLanjut").classList.add("hidden");
            document.getElementById("tombolSelesai").classList.add("hidden");
            document.getElementById("areaSoal").classList.remove("hidden");

            // Reset timer
            waktuTersisa = WAKTU_PER_SOAL;
            document.getElementById("timerDisplay").innerHTML = waktuTersisa;
            document.getElementById("timerFill").style.width = "100%";
            startTimer();
        }

        // Pilih jawaban
        function pilihJawaban(btn, dipilih, kunciBenar) {
            if (sudahDijawab) return;
            sudahDijawab = true;
            stopTimer();

            const semuaBtn = document.querySelectorAll(".option-btn");
            semuaBtn.forEach(b => b.classList.add("disabled"));

            const isBenar = (dipilih === kunciBenar);
            const pesan = document.getElementById("pesanHasil");
            pesan.classList.remove("hidden");

            // Tandai semua opsi
            semuaBtn.forEach(b => {
                if (b.dataset.value === kunciBenar) {
                    b.classList.add("correct");
                } else if (b === btn && !isBenar) {
                    b.classList.add("wrong");
                }
            });

            if (isBenar) {
                skorSesi += 10;
                streakSesi += 1;
                pesan.innerHTML = `✅ <b>Benar!</b> +10 poin (🔥 Streak: ${streakSesi})`;
                pesan.className = "mt-4 p-4 rounded-xl border-2 border-green-200 bg-green-50 text-green-700 text-center font-bold text-lg";
            } else {
                streakSesi = 0;
                pesan.innerHTML = `❌ <b>Kurang tepat.</b> Jawaban yang benar: <span class="font-bold text-green-600">"${kunciBenar}"</span>`;
                pesan.className = "mt-4 p-4 rounded-xl border-2 border-red-200 bg-red-50 text-red-700 text-center font-bold text-lg";
            }

            // Update tampilan skor & streak
            document.getElementById("skorSesi").innerHTML = skorSesi;
            document.getElementById("streak").innerHTML = streakSesi;

            // Tampilkan tombol lanjut / selesai
            if (indeksAktif < MAX_SOAL - 1) {
                document.getElementById("tombolLanjut").classList.remove("hidden");
            } else {
                document.getElementById("tombolSelesai").classList.remove("hidden");
            }
        }

        // Soal berikutnya
        function soalBerikutnya() {
            indeksAktif++;
            muatSoal();
        }

        // ============================================================
        //  TIMER
        // ============================================================
        function startTimer() {
            stopTimer();
            waktuTersisa = WAKTU_PER_SOAL;
            document.getElementById("timerDisplay").innerHTML = waktuTersisa;
            document.getElementById("timerFill").style.width = "100%";

            timerInterval = setInterval(function() {
                waktuTersisa--;
                document.getElementById("timerDisplay").innerHTML = waktuTersisa;
                const pct = (waktuTersisa / WAKTU_PER_SOAL) * 100;
                document.getElementById("timerFill").style.width = pct + "%";

                if (waktuTersisa <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    // Timeout: otomatis salah
                    if (!sudahDijawab) {
                        sudahDijawab = true;
                        const soal = sesiSoal[indeksAktif];
                        const semuaBtn = document.querySelectorAll(".option-btn");
                        semuaBtn.forEach(b => {
                            b.classList.add("disabled");
                            if (b.dataset.value === soal.meaning) {
                                b.classList.add("correct");
                            }
                        });
                        const pesan = document.getElementById("pesanHasil");
                        pesan.classList.remove("hidden");
                        pesan.innerHTML = `⏰ <b>Waktu habis!</b> Jawaban yang benar: <span class="font-bold text-green-600">"${soal.meaning}"</span>`;
                        pesan.className = "mt-4 p-4 rounded-xl border-2 border-yellow-200 bg-yellow-50 text-yellow-700 text-center font-bold text-lg";
                        streakSesi = 0;
                        document.getElementById("streak").innerHTML = streakSesi;

                        if (indeksAktif < MAX_SOAL - 1) {
                            document.getElementById("tombolLanjut").classList.remove("hidden");
                        } else {
                            document.getElementById("tombolSelesai").classList.remove("hidden");
                        }
                    }
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // ============================================================
        //  SIMPAN POIN
        // ============================================================
        function simpanPoinDanSelesai() {
            totalPoinLama = parseInt(localStorage.getItem('poinMurid')) || 0;
            localStorage.setItem('poinMurid', totalPoinLama + skorSesi);
            // Redirect ke halaman utama
            window.location.href = "index.html";
        }

        // ============================================================
        //  INISIALISASI
        // ============================================================
        function initGame() {
            // Tampilkan poin total dari localStorage
            const poin = parseInt(localStorage.getItem('poinMurid')) || 0;
            document.getElementById("poinTotal").innerHTML = poin;

            // Ambil 10 soal acak
            sesiSoal = ambilSoalAcak();
            indeksAktif = 0;
            skorSesi = 0;
            streakSesi = 0;
            document.getElementById("skorSesi").innerHTML = "0";
            document.getElementById("streak").innerHTML = "0";
            muatSoal();
        }

        initGame();
    </script>
</body>
</html>
