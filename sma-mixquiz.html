<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mix Quiz SMA | ENG-LEARN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }
        body {
            min-height: 100vh;
            padding: 1.5rem;
            background: linear-gradient(135deg, #fff7ed, #fed7aa);
        }
        .max-w-3xl {
            max-width: 48rem;
            margin-left: auto;
            margin-right: auto;
        }
        .option-btn {
            transition: all 0.2s ease;
            border: 2px solid #e5e7eb;
            background: white;
            padding: 14px 12px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.95rem;
            min-height: 50px;
            cursor: pointer;
            text-align: left;
        }
        .option-btn:hover {
            border-color: #f97316;
            background: #fff7ed;
        }
        .option-btn.correct {
            border-color: #22c55e;
            background: #dcfce7;
        }
        .option-btn.wrong {
            border-color: #ef4444;
            background: #fee2e2;
        }
        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.7;
        }
        .option-btn.selected {
            border-color: #f97316;
            background: #ffedd5;
        }
        @media (max-width: 640px) {
            .option-btn {
                font-size: 0.85rem !important;
                padding: 12px 10px !important;
                min-height: 46px !important;
            }
            .bg-white.rounded-3xl {
                padding: 16px !important;
            }
            #teksSoal {
                font-size: 0.95rem !important;
            }
            .max-w-3xl.mx-auto.mb-6.flex.justify-between {
                flex-wrap: wrap !important;
                gap: 12px !important;
            }
            #tombolKirim,
            #tombolLanjut,
            #tombolSelesai {
                padding: 16px !important;
                font-size: 1rem !important;
                min-height: 56px !important;
            }
            .flex.gap-3 {
                flex-direction: column !important;
                gap: 10px !important;
            }
        }
        button:active {
            transform: scale(0.96);
        }
        .text-bacaan {
            background: #f8fafc;
            border-left: 4px solid #8b5cf6;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.8;
            max-height: 180px;
            overflow-y: auto;
        }
        .badge-tipe {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-vocab {
            background: #3b82f6;
            color: white;
        }
        .badge-grammar {
            background: #f59e0b;
            color: white;
        }
        .badge-reading {
            background: #8b5cf6;
            color: white;
        }
        .btn-back {
            background: white;
            border-radius: 12px;
            padding: 8px 16px;
            font-weight: 600;
            color: #d97706;
            border: 2px solid #fde68a;
            transition: all 0.2s;
        }
        .btn-back:hover {
            background: #fffbeb;
        }
        .hasil-box {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="max-w-3xl mx-auto">

        <!-- TOP BAR -->
        <div class="mb-6 flex flex-wrap justify-between items-center gap-3">
            <a href="sma.html" onclick="return confirm('Kak, yakin mau kembali? Poin sesi ini akan hangus lho!')" class="btn-back inline-flex items-center gap-1">
                ⬅️ Batal & Kembali
            </a>
            <div class="bg-orange-500 text-white font-bold px-6 py-2 rounded-xl shadow-md flex items-center gap-2 text-lg">
                ⭐ Poin Sesi: <span id="poinSesiTampil">0</span>
            </div>
        </div>

        <!-- KARTU MIX QUIZ -->
        <div class="bg-white rounded-3xl p-8 shadow-xl border-2 border-orange-100">

            <div class="flex justify-between items-center mb-4 border-b-2 border-orange-100 pb-4">
                <h1 class="text-2xl font-extrabold text-gray-800 flex items-center gap-2">
                    🧩 Mix Quiz <span class="text-orange-500">SMA</span>
                </h1>
                <span id="labelNomorSoal" class="bg-orange-100 text-orange-700 font-bold px-4 py-1 rounded-full text-sm">
                    Soal 1 dari 20
                </span>
            </div>

            <div class="bg-gray-50 p-6 rounded-2xl border-2 border-gray-100">

                <!-- Tipe Soal -->
                <div id="tipeSoal" class="mb-3">
                    <span class="badge-tipe badge-vocab">Vocabulary</span>
                </div>

                <!-- Teks Bacaan (khusus Reading) -->
                <div id="teksBacaan" class="text-bacaan mb-4 hidden">
                    Teks bacaan...
                </div>

                <!-- Pertanyaan -->
                <div id="teksSoal" class="text-lg font-bold text-gray-800 mb-4">
                    Pertanyaan...
                </div>

                <!-- Opsi Jawaban -->
                <div id="areaPilihan" class="grid grid-cols-1 gap-3 mb-6"></div>

                <!-- Tombol Kirim -->
                <button id="tombolKirim" onclick="kirimJawaban()" class="w-full bg-orange-500 text-white px-6 py-3 rounded-xl font-bold text-lg hover:bg-orange-600 shadow-md transition-colors mb-4">
                    🚀 Kirim Jawaban
                </button>

                <!-- Feedback Hasil -->
                <div id="pesanHasil" class="hidden mb-6 p-4 rounded-xl border-2 text-center font-bold text-lg"></div>

                <!-- Navigasi -->
                <div class="flex gap-3">
                    <button id="tombolSebelumnya" onclick="soalSebelumnya()" class="hidden flex-1 bg-gray-500 text-white px-6 py-4 rounded-xl font-bold text-lg hover:bg-gray-600 shadow-md transition-colors">
                        ⬅️ Sebelumnya
                    </button>
                    <button id="tombolLanjut" onclick="soalBerikutnya()" class="hidden flex-1 bg-green-500 text-white px-6 py-4 rounded-xl font-bold text-lg hover:bg-green-600 shadow-md transition-colors">
                        ➡️ Lanjut
                    </button>
                </div>

                <!-- Tombol Selesai -->
                <button id="tombolSelesai" onclick="simpanPoinDanSelesai()" class="hidden mt-6 w-full bg-green-600 text-white px-6 py-4 rounded-xl font-bold text-xl hover:bg-green-700 shadow-lg">
                    🎉 Selesai & Simpan Poin!
                </button>

                <!-- SKOR AKHIR -->
                <div id="hasilSkor" class="hidden mt-6 p-6 rounded-2xl border-2 border-indigo-200 bg-indigo-50 text-center hasil-box">
                    <div class="text-4xl mb-2">🎉</div>
                    <h2 class="text-2xl font-extrabold text-gray-800 mb-2">Selesai!</h2>
                    <div class="text-3xl font-extrabold text-indigo-600 mb-2">
                        <span id="skorBenar">0</span> dari <span id="skorTotal">0</span>
                        <span id="skorPersen" class="text-lg font-semibold text-gray-500">(0%)</span>
                    </div>
                    <div class="flex justify-center gap-6 text-sm text-gray-600 mb-4">
                        <div>✅ Benar: <span id="benarCount" class="font-bold text-green-600">0</span></div>
                        <div>❌ Salah: <span id="salahCount" class="font-bold text-red-600">0</span></div>
                    </div>
                    <div class="text-sm text-gray-500 mb-4">
                        💡 Poin yang didapat: <span id="skorPoinAkhir" class="font-bold text-indigo-600">0</span>
                    </div>
                    <a href="sma.html" class="inline-block bg-indigo-600 text-white px-6 py-3 rounded-full font-bold hover:bg-indigo-700 transition shadow-md">
                        🏠 Kembali ke Dashboard
                    </a>
                </div>

            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  20 SOAL MIX QUIZ SMA
        //  5 Vocabulary, 10 Grammar, 5 Reading
        // ================================================================
        const daftarSoal = [{
            tipe: "Vocabulary",
            soal: "What is the meaning of 'abandon'?",
            pilihan: ["Meninggalkan", "Mengambil", "Memperbaiki", "Menemukan"],
            kunci: 0
        }, {
            tipe: "Vocabulary",
            soal: "What is the meaning of 'accelerate'?",
            pilihan: ["Memperlambat", "Mempercepat", "Menghentikan", "Memulai"],
            kunci: 1
        }, {
            tipe: "Vocabulary",
            soal: "What is the meaning of 'convince'?",
            pilihan: ["Membingungkan", "Meyakinkan", "Menolak", "Menghindari"],
            kunci: 1
        }, {
            tipe: "Vocabulary",
            soal: "What is the meaning of 'significant'?",
            pilihan: ["Kecil", "Penting", "Biasa", "Berbahaya"],
            kunci: 1
        }, {
            tipe: "Vocabulary",
            soal: "What is the meaning of 'guarantee'?",
            pilihan: ["Jaminan", "Keraguan", "Kehilangan", "Kesalahan"],
            kunci: 0
        }, {
            tipe: "Grammar",
            soal: "If I _____ you, I would accept the offer.",
            pilihan: ["am", "was", "were", "have been"],
            kunci: 2
        }, {
            tipe: "Grammar",
            soal: "The letter _____ by the secretary yesterday.",
            pilihan: ["sent", "is sent", "was sent", "has sent"],
            kunci: 2
        }, {
            tipe: "Grammar",
            soal: "He said he _____ the document already.",
            pilihan: ["has", "have", "had", "will have"],
            kunci: 2
        }, {
            tipe: "Grammar",
            soal: "I suggest that he _____ harder.",
            pilihan: ["study", "studies", "studied", "will study"],
            kunci: 0
        }, {
            tipe: "Grammar",
            soal: "She stopped _____ because she was tired.",
            pilihan: ["smoke", "to smoke", "smoking", "smoked"],
            kunci: 2
        }, {
            tipe: "Grammar",
            soal: "I wish I _____ swim.",
            pilihan: ["can", "could", "will", "would"],
            kunci: 1
        }, {
            tipe: "Grammar",
            soal: "By next month, I _____ this project.",
            pilihan: ["finish", "finished", "will finish", "will have finished"],
            kunci: 3
        }, {
            tipe: "Grammar",
            soal: "_____ the rain, we went out.",
            pilihan: ["Although", "Despite", "Because", "Unless"],
            kunci: 1
        }, {
            tipe: "Grammar",
            soal: "The news _____ very shocking.",
            pilihan: ["are", "is", "were", "have been"],
            kunci: 1
        }, {
            tipe: "Grammar",
            soal: "It was _____ hot that we went swimming.",
            pilihan: ["so", "such", "too", "very"],
            kunci: 0
        }, {
            tipe: "Reading",
            bacaan: "The Komodo dragon is the largest lizard in the world. It can grow up to 3 meters long and weigh up to 70 kilograms. They are carnivores and eat deer, pigs, and even water buffalo.",
            soal: "What is the main idea of the text?",
            pilihan: [
                "The habitat of Komodo dragons",
                "General information about Komodo dragons",
                "The diet of Komodo dragons",
                "The danger of Komodo dragons"
            ],
            kunci: 1
        }, {
            tipe: "Reading",
            bacaan: "The Komodo dragon is the largest lizard in the world. It can grow up to 3 meters long and weigh up to 70 kilograms. They are carnivores and eat deer, pigs, and even water buffalo.",
            soal: "What does 'carnivores' mean in the text?",
            pilihan: [
                "Animals that eat plants",
                "Animals that eat meat",
                "Animals that eat both plants and meat",
                "Animals that eat insects"
            ],
            kunci: 1
        }, {
            tipe: "Reading",
            bacaan: "Social media has become a big part of our daily lives. While it can be fun, it also has negative effects. Therefore, we should limit our time on social media.",
            soal: "What is the writer's suggestion?",
            pilihan: [
                "Use social media more often",
                "Limit time on social media",
                "Delete all social media",
                "Only use social media at night"
            ],
            kunci: 1
        }, {
            tipe: "Reading",
            bacaan: "Social media has become a big part of our daily lives. While it can be fun, it also has negative effects. Therefore, we should limit our time on social media.",
            soal: "What is one negative effect of social media mentioned?",
            pilihan: [
                "It improves communication",
                "It causes addiction",
                "It makes people happy",
                "It helps education"
            ],
            kunci: 1
        }, {
            tipe: "Reading",
            bacaan: "Once upon a time, a poor farmer found a golden egg. He became rich but greedy. He cut the goose open to get all the gold, but found nothing. He lost everything.",
            soal: "What is the moral of the story?",
            pilihan: [
                "Hard work is important",
                "Greed leads to loss",
                "Golden eggs are valuable",
                "Farmers are lucky"
            ],
            kunci: 1
        }];

        // ================================================================
        //  STATE & LOGIC
        // ================================================================
        let indeksSoalAktif = 0;
        let poinSesi = 0;
        let pilihanDipilih = null;
        let statusRiwayat = {};

        function muatSoal() {
            let soal = daftarSoal[indeksSoalAktif];
            document.getElementById("labelNomorSoal").innerHTML = "Soal " + (indeksSoalAktif + 1) + " dari " + daftarSoal.length;

            // Tipe Soal
            let tipeEl = document.getElementById("tipeSoal");
            let badgeClass = "badge-tipe ";
            if (soal.tipe === "Vocabulary") badgeClass += "badge-vocab";
            else if (soal.tipe === "Grammar") badgeClass += "badge-grammar";
            else badgeClass += "badge-reading";
            tipeEl.innerHTML = '<span class="' + badgeClass + '">' + soal.tipe + '</span>';

            // Teks Bacaan (khusus Reading)
            let bacaanEl = document.getElementById("teksBacaan");
            if (soal.tipe === "Reading" && soal.bacaan) {
                bacaanEl.classList.remove("hidden");
                bacaanEl.innerHTML = soal.bacaan;
            } else {
                bacaanEl.classList.add("hidden");
                bacaanEl.innerHTML = "";
            }

            // Pertanyaan
            document.getElementById("teksSoal").innerHTML = soal.soal;

            // Opsi
            let areaPilihan = document.getElementById("areaPilihan");
            areaPilihan.innerHTML = "";
            pilihanDipilih = null;

            soal.pilihan.forEach(function(opsi, index) {
                let tombol = document.createElement("button");
                tombol.innerHTML = String.fromCharCode(65 + index) + ". " + opsi;
                tombol.id = "opsi-" + index;
                tombol.className = "option-btn";
                tombol.dataset.index = index;
                tombol.onclick = function() { pilihOpsi(index); };
                areaPilihan.appendChild(tombol);
            });

            // Navigasi
            if (indeksSoalAktif > 0) {
                document.getElementById("tombolSebelumnya").classList.remove("hidden");
            } else {
                document.getElementById("tombolSebelumnya").classList.add("hidden");
            }

            // Riwayat
            let riwayat = statusRiwayat[indeksSoalAktif];
            if (riwayat && riwayat.sudahBenar) {
                pilihanDipilih = riwayat.pilihan;
                tandaiTombolTerpilih(pilihanDipilih);
                tampilkanHasilDanBedah(true, true);
            } else {
                document.getElementById("pesanHasil").classList.add("hidden");
                document.getElementById("tombolLanjut").classList.add("hidden");
                document.getElementById("tombolKirim").classList.remove("hidden");
                document.getElementById("tombolSelesai").classList.add("hidden");
                document.querySelectorAll(".option-btn").forEach(b => {
                    b.classList.remove("selected", "correct", "wrong", "disabled");
                });
            }
        }

        function pilihOpsi(index) {
            let riwayat = statusRiwayat[indeksSoalAktif];
            if (riwayat && riwayat.sudahBenar) return;
            pilihanDipilih = index;
            tandaiTombolTerpilih(index);
        }

        function tandaiTombolTerpilih(index) {
            document.querySelectorAll(".option-btn").forEach((btn, i) => {
                btn.classList.remove("selected");
                if (i === index) btn.classList.add("selected");
            });
        }

        function kirimJawaban() {
            if (pilihanDipilih === null) {
                alert("Kak, pilih dulu jawabannya ya!");
                return;
            }

            let soalAktif = daftarSoal[indeksSoalAktif];
            let isBenar = (pilihanDipilih === soalAktif.kunci);

            if (isBenar) {
                if (!statusRiwayat[indeksSoalAktif] || !statusRiwayat[indeksSoalAktif].sudahBenar) {
                    poinSesi += 15;
                    document.getElementById("poinSesiTampil").innerHTML = poinSesi;
                }
                statusRiwayat[indeksSoalAktif] = { sudahBenar: true, pilihan: pilihanDipilih };
            } else {
                statusRiwayat[indeksSoalAktif] = { sudahBenar: false, pilihan: pilihanDipilih };
            }

            tampilkanHasilDanBedah(isBenar, false);

            // LANGSUNG MUNCULKAN TOMBOL LANJUT (meskipun salah)
            document.getElementById("tombolKirim").classList.add("hidden");
            if (indeksSoalAktif < daftarSoal.length - 1) {
                document.getElementById("tombolLanjut").classList.remove("hidden");
            } else {
                document.getElementById("tombolSelesai").classList.remove("hidden");
            }
        }

        function tampilkanHasilDanBedah(isBenar, dariReview) {
            let soalAktif = daftarSoal[indeksSoalAktif];
            let pesan = document.getElementById("pesanHasil");
            pesan.classList.remove("hidden");

            document.querySelectorAll(".option-btn").forEach((btn, i) => {
                btn.classList.add("disabled");
                if (i === soalAktif.kunci) {
                    btn.classList.add("correct");
                } else if (i === pilihanDipilih && !isBenar) {
                    btn.classList.add("wrong");
                }
            });

            if (isBenar) {
                pesan.innerHTML = dariReview ?
                    '📚 <b>Mode Review:</b> Soal ini sudah kamu jawab dengan benar sebelumnya.' :
                    '🎉 <b>Tepat sekali! Pilihanmu benar.</b> (+15 Poin)';
                pesan.className = "mb-4 p-4 rounded-xl border-2 bg-green-50 text-green-800 border-green-200 text-base";
            } else {
                let jawabanBenar = String.fromCharCode(65 + soalAktif.kunci) + ". " + soalAktif.pilihan[soalAktif.kunci];
                pesan.innerHTML = '⚠️ <b>Kurang tepat.</b> Jawaban yang benar: <span class="text-green-600 font-bold">' + jawabanBenar + '</span>';
                pesan.className = "mb-4 p-4 rounded-xl border-2 bg-red-50 text-red-800 border-red-200 text-base";
            }
        }

        function soalBerikutnya() {
            indeksSoalAktif++;
            muatSoal();
        }

        function soalSebelumnya() {
            if (indeksSoalAktif > 0) {
                indeksSoalAktif--;
                muatSoal();
            }
        }

        function simpanPoinDanSelesai() {
            // ===== HITUNG SKOR =====
            let totalSoal = daftarSoal.length;
            let benar = 0;
            for (let i = 0; i < totalSoal; i++) {
                if (statusRiwayat[i] && statusRiwayat[i].sudahBenar) {
                    benar++;
                }
            }
            let salah = totalSoal - benar;

            // ===== TAMPILKAN SKOR =====
            document.getElementById("hasilSkor").classList.remove("hidden");
            document.getElementById("skorBenar").innerHTML = benar;
            document.getElementById("skorTotal").innerHTML = totalSoal;
            document.getElementById("benarCount").innerHTML = benar;
            document.getElementById("salahCount").innerHTML = salah;
            document.getElementById("skorPoinAkhir").innerHTML = poinSesi;
            let persen = Math.round((benar / totalSoal) * 100);
            document.getElementById("skorPersen").innerHTML = "(" + persen + "%)";

            // ===== SEMBUNYIKAN TOMBOL SELESAI =====
            document.getElementById("tombolSelesai").classList.add("hidden");

            // ===== SIMPAN POIN =====
            let poinTotalLama = parseInt(localStorage.getItem('poinMurid')) || 0;
            localStorage.setItem('poinMurid', poinTotalLama + poinSesi);
        }

        // ================================================================
        //  INISIALISASI
        // ================================================================
        muatSoal();
    </script>
</body>
</html>
