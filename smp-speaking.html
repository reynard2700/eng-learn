<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speaking SMP (10 Soal) | ENG-LEARN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }
        body {
            min-height: 100vh;
            padding: 1.5rem;
            background-color: #eff6ff;
        }
        .max-w-3xl {
            max-width: 48rem;
            margin-left: auto;
            margin-right: auto;
        }
        @media (max-width: 640px) {
            .bg-white.rounded-3xl {
                padding: 16px !important;
            }
            #teksSoal {
                font-size: 1.6rem !important;
                padding: 16px 12px !important;
            }
            .bg-green-500.px-6.py-3,
            .bg-purple-500.px-6.py-3,
            .bg-red-500.px-6.py-3 {
                padding: 14px 18px !important;
                font-size: 0.95rem !important;
                min-height: 52px !important;
            }
            #teksTangkapan {
                font-size: 1rem !important;
                min-height: 50px !important;
            }
            #tombolLanjut,
            #tombolSelesai {
                padding: 16px !important;
                font-size: 1rem !important;
                min-height: 56px !important;
            }
            .max-w-3xl.mx-auto.mb-6.flex.justify-between {
                flex-wrap: wrap !important;
                gap: 12px !important;
            }
            .flex.gap-3 {
                flex-direction: column !important;
                gap: 10px !important;
            }
        }
        button:active {
            transform: scale(0.96);
        }
        .btn-back {
            background: white;
            border-radius: 12px;
            padding: 8px 16px;
            font-weight: 600;
            color: #4f46e5;
            border: 2px solid #e0e7ff;
            transition: all 0.2s;
        }
        .btn-back:hover {
            background: #eef2ff;
        }
        .hasil-box {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="max-w-3xl mx-auto">

        <!-- TOP BAR -->
        <div class="mb-6 flex flex-wrap justify-between items-center gap-3">
            <a href="smp.html" onclick="return confirm('Kak, yakin mau kembali? Poin sesi ini akan hangus lho!')" class="btn-back inline-flex items-center gap-1">
                ⬅️ Batal & Kembali
            </a>
            <div class="bg-blue-500 text-white font-bold px-6 py-2 rounded-xl shadow-md flex items-center gap-2 text-lg">
                ⭐ Poin Sesi: <span id="poinSesiTampil">0</span>
            </div>
        </div>

        <!-- KARTU SPEAKING -->
        <div class="bg-white rounded-3xl p-8 shadow-xl border-2 border-blue-100 text-center">

            <div class="flex justify-between items-center mb-4 border-b-2 border-blue-100 pb-4 text-left">
                <h1 class="text-2xl font-extrabold text-gray-800 flex items-center gap-2">
                    🗣️ Speaking <span class="text-blue-500">SMP</span>
                </h1>
                <span id="labelNomorSoal" class="bg-blue-100 text-blue-700 font-bold px-4 py-1 rounded-full text-sm">
                    Soal 1 dari 10
                </span>
            </div>

            <div class="bg-gray-50 p-6 rounded-2xl border-2 border-gray-100">

                <p class="mb-3 text-gray-700 font-semibold">Ucapkan kalimat berikut dengan lantang:</p>

                <div id="teksSoal" class="text-3xl font-extrabold text-blue-600 mb-6 bg-white py-6 px-4 rounded-2xl border-2 border-blue-200 shadow-sm"></div>

                <div class="flex justify-center gap-4 mb-6 flex-wrap">
                    <button onclick="putarContoh()" class="bg-green-500 text-white px-6 py-3 rounded-2xl font-bold text-lg hover:bg-green-600 shadow-md inline-flex items-center gap-2">
                        🔊 Dengar Contoh
                    </button>
                    <button id="tombolBicara" onclick="mulaiMendengar()" class="bg-purple-500 text-white px-6 py-3 rounded-2xl font-bold text-lg hover:bg-purple-600 shadow-md inline-flex items-center gap-2">
                        🎤 Mulai Bicara
                    </button>
                </div>

                <p class="text-gray-500 font-medium mb-1">Yang komputer dengar:</p>
                <div id="teksTangkapan" class="text-xl font-mono bg-white border border-gray-200 p-4 rounded-xl min-h-[60px] flex items-center justify-center mb-4 shadow-inner">
                    (Belum ada suara)
                </div>

                <button id="tombolLanjut" onclick="soalBerikutnya()" class="hidden w-full bg-green-500 text-white px-6 py-3 rounded-xl font-bold hover:bg-green-600 shadow-md">
                    ➡️ Lanjut Soal Berikutnya
                </button>

                <p id="pesanHasil" class="text-lg font-bold hidden p-4 rounded-xl mt-4"></p>

                <button id="tombolSelesai" onclick="simpanPoinDanSelesai()" class="hidden mt-6 w-full bg-green-600 text-white px-6 py-4 rounded-xl font-bold text-xl hover:bg-green-700 shadow-lg">
                    🎉 Selesai! Simpan Semua Poin
                </button>

                <!-- SKOR AKHIR -->
                <div id="hasilSkor" class="hidden mt-6 p-6 rounded-2xl border-2 border-indigo-200 bg-indigo-50 text-center hasil-box">
                    <div class="text-4xl mb-2">🎉</div>
                    <h2 class="text-2xl font-extrabold text-gray-800 mb-2">Selesai!</h2>
                    <div class="text-3xl font-extrabold text-indigo-600 mb-2">
                        <span id="skorBenar">0</span> dari <span id="skorTotal">0</span>
                        <span id="skorPersen" class="text-lg font-semibold text-gray-500">(0%)</span>
                    </div>
                    <div class="flex justify-center gap-6 text-sm text-gray-600 mb-4">
                        <div>✅ Benar: <span id="benarCount" class="font-bold text-green-600">0</span></div>
                        <div>❌ Salah: <span id="salahCount" class="font-bold text-red-600">0</span></div>
                    </div>
                    <div class="text-sm text-gray-500 mb-4">
                        💡 Poin yang didapat: <span id="skorPoinAkhir" class="font-bold text-indigo-600">0</span>
                    </div>
                    <a href="smp.html" class="inline-block bg-indigo-600 text-white px-6 py-3 rounded-full font-bold hover:bg-indigo-700 transition shadow-md">
                        🏠 Kembali ke Dashboard
                    </a>
                </div>

            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  10 SOAL SPEAKING SMP
        // ================================================================
        const daftarSoal = [
            { kunci: "good morning", teks: "Good morning", clue: "💡 Kata sapaan pagi (2 kata)." },
            { kunci: "good afternoon", teks: "Good afternoon", clue: "💡 Kata sapaan siang (2 kata)." },
            { kunci: "thank you", teks: "Thank you", clue: "💡 Dua kata untuk berterima kasih." },
            { kunci: "you are welcome", teks: "You're welcome", clue: "💡 Ucapkan 'You are welcome' (3 kata)." },
            { kunci: "how are you", teks: "How are you?", clue: "💡 Tiga kata untuk menanyakan kabar." },
            { kunci: "goodbye", teks: "Goodbye", clue: "💡 Satu kata untuk pamit." },
            { kunci: "im sorry", teks: "I'm sorry", clue: "💡 Dua kata untuk minta maaf." },
            { kunci: "good night", teks: "Good night", clue: "💡 Dua kata untuk malam." },
            { kunci: "nice to meet you", teks: "Nice to meet you", clue: "💡 Empat kata saat berkenalan." },
            { kunci: "can you help me", teks: "Can you help me?", clue: "💡 Empat kata untuk minta bantuan." }
        ];

        // ================================================================
        //  STATE & LOGIC
        // ================================================================
        let indeksSoalAktif = 0;
        let poinSesi = 0;
        let sudahBenar = false;
        let statusRiwayat = {};

        function muatSoal() {
            let soal = daftarSoal[indeksSoalAktif];
            document.getElementById("labelNomorSoal").innerHTML = "Soal " + (indeksSoalAktif + 1) + " dari " + daftarSoal.length;
            document.getElementById("teksSoal").innerHTML = '"' + soal.teks + '"';
            document.getElementById("teksTangkapan").innerHTML = "(Belum ada suara)";
            document.getElementById("pesanHasil").classList.add("hidden");
            document.getElementById("tombolLanjut").classList.add("hidden");
            document.getElementById("tombolSelesai").classList.add("hidden");
            document.getElementById("hasilSkor").classList.add("hidden");

            let tombol = document.getElementById("tombolBicara");
            tombol.innerHTML = '🎤 Mulai Bicara';
            tombol.className = "bg-purple-500 text-white px-6 py-3 rounded-2xl font-bold text-lg hover:bg-purple-600 shadow-md inline-flex items-center gap-2";

            let riwayat = statusRiwayat[indeksSoalAktif];
            if (riwayat && riwayat.sudahBenar) {
                sudahBenar = true;
                tampilkanHasil(true, true);
            } else {
                sudahBenar = false;
                document.querySelectorAll(".option-btn")?.forEach(b => b.classList.remove("selected", "correct", "wrong", "disabled"));
            }
        }

        function putarContoh() {
            let soal = daftarSoal[indeksSoalAktif];
            let suara = new SpeechSynthesisUtterance(soal.teks);
            suara.lang = "en-US";
            suara.rate = 0.85;
            window.speechSynthesis.speak(suara);
        }

        function mulaiMendengar() {
            if (sudahBenar) return;

            let tombol = document.getElementById("tombolBicara");
            let teksTangkapan = document.getElementById("teksTangkapan");
            let pesanHasil = document.getElementById("pesanHasil");

            let TelingaKomputer = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!TelingaKomputer) {
                alert("Kak, gunakan Google Chrome terbaru untuk fitur suara ya!");
                return;
            }

            let mesinPengecek = new TelingaKomputer();
            mesinPengecek.lang = "en-US";

            tombol.innerHTML = "🔴 Mendengarkan...";
            tombol.className = "bg-red-500 text-white px-6 py-3 rounded-2xl font-bold text-lg shadow-md inline-flex items-center gap-2";
            mesinPengecek.start();

            mesinPengecek.onresult = function(event) {
                let hasilSuara = event.results[0][0].transcript.toLowerCase();
                teksTangkapan.innerHTML = '"' + hasilSuara + '"';
                pesanHasil.classList.remove("hidden");

                let soalAktif = daftarSoal[indeksSoalAktif];
                let isMatch = hasilSuara.includes(soalAktif.kunci);

                // Fallback untuk "you're welcome"
                if (!isMatch && soalAktif.kunci === "you are welcome") {
                    if (hasilSuara.includes("you're welcome") || hasilSuara.includes("you are welcome")) {
                        isMatch = true;
                    }
                }

                if (isMatch) {
                    if (!statusRiwayat[indeksSoalAktif] || !statusRiwayat[indeksSoalAktif].sudahBenar) {
                        poinSesi += 10;
                        document.getElementById("poinSesiTampil").innerHTML = poinSesi;
                    }
                    statusRiwayat[indeksSoalAktif] = { sudahBenar: true };
                    sudahBenar = true;
                    tampilkanHasil(true, false);

                    tombol.innerHTML = "✅ Selesai";
                    tombol.className = "bg-gray-400 text-white px-6 py-3 rounded-2xl font-bold text-lg shadow-md inline-flex items-center gap-2";

                    if (indeksSoalAktif < daftarSoal.length - 1) {
                        document.getElementById("tombolLanjut").classList.remove("hidden");
                    } else {
                        document.getElementById("tombolSelesai").classList.remove("hidden");
                    }
                } else {
                    tampilkanHasil(false, false);
                }
            };

            mesinPengecek.onspeechend = function() {
                mesinPengecek.stop();
                if (!sudahBenar) {
                    tombol.innerHTML = '🎤 Mulai Bicara';
                    tombol.className = "bg-purple-500 text-white px-6 py-3 rounded-2xl font-bold text-lg hover:bg-purple-600 shadow-md inline-flex items-center gap-2";
                }
            };

            mesinPengecek.onerror = function() {
                if (!sudahBenar) {
                    tombol.innerHTML = '🎤 Mulai Bicara';
                    tombol.className = "bg-purple-500 text-white px-6 py-3 rounded-2xl font-bold text-lg hover:bg-purple-600 shadow-md inline-flex items-center gap-2";
                }
            };
        }

        function tampilkanHasil(isBenar, dariReview) {
            let pesanHasil = document.getElementById("pesanHasil");
            pesanHasil.classList.remove("hidden");
            let soalAktif = daftarSoal[indeksSoalAktif];

            if (isBenar) {
                pesanHasil.innerHTML = dariReview ?
                    '📚 <b>Mode Review:</b> Soal ini sudah kamu jawab dengan benar sebelumnya.' :
                    '✅ Pelafalan Sempurna! (+10 Poin)';
                pesanHasil.className = "mt-4 text-xl font-bold p-4 rounded-xl bg-green-100 text-green-700 border-2 border-green-200";
            } else {
                pesanHasil.innerHTML = '❌ Pelafalan kurang akurat.<br /><span class="text-sm font-normal">' + soalAktif.clue + '</span>';
                pesanHasil.className = "mt-4 text-xl font-bold p-4 rounded-xl bg-red-100 text-red-700 border-2 border-red-200";
            }
        }

        function soalBerikutnya() {
            indeksSoalAktif++;
            muatSoal();
        }

        function simpanPoinDanSelesai() {
            // ===== HITUNG SKOR =====
            let totalSoal = daftarSoal.length;
            let benar = 0;
            for (let i = 0; i < totalSoal; i++) {
                if (statusRiwayat[i] && statusRiwayat[i].sudahBenar) {
                    benar++;
                }
            }
            let salah = totalSoal - benar;

            // ===== TAMPILKAN SKOR =====
            document.getElementById("hasilSkor").classList.remove("hidden");
            document.getElementById("skorBenar").innerHTML = benar;
            document.getElementById("skorTotal").innerHTML = totalSoal;
            document.getElementById("benarCount").innerHTML = benar;
            document.getElementById("salahCount").innerHTML = salah;
            document.getElementById("skorPoinAkhir").innerHTML = poinSesi;
            let persen = Math.round((benar / totalSoal) * 100);
            document.getElementById("skorPersen").innerHTML = "(" + persen + "%)";

            // ===== SEMBUNYIKAN TOMBOL SELESAI =====
            document.getElementById("tombolSelesai").classList.add("hidden");

            // ===== SIMPAN POIN =====
            let poinTotalLama = parseInt(localStorage.getItem('poinMurid')) || 0;
            localStorage.setItem('poinMurid', poinTotalLama + poinSesi);
        }

        // ================================================================
        //  INISIALISASI
        // ================================================================
        muatSoal();
    </script>
</body>
</html>
