<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Translator Pintar | ENG-LEARN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }
        body {
            min-height: 100vh;
            padding: 1.5rem;
            background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
        }
        .max-w-3xl {
            max-width: 48rem;
            margin-left: auto;
            margin-right: auto;
        }
        .btn-translate {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.4);
        }
        .btn-translate:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.6);
        }
        .btn-swap {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: white;
            border: 2px solid #e5e7eb;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
        .btn-swap:hover {
            border-color: #6366f1;
            transform: rotate(180deg);
            background: #eef2ff;
        }
        .result-box {
            transition: all 0.3s ease;
        }
        .result-box:hover {
            border-color: #818cf8;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.1);
        }
        input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        @media (max-width: 640px) {
            .bg-white.rounded-3xl {
                padding: 16px !important;
            }
            .text-3xl {
                font-size: 1.8rem !important;
            }
            input[type="text"] {
                font-size: 1rem !important;
                padding: 14px !important;
            }
            .btn-swap {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
                margin: 8px auto;
            }
        }
        button:active {
            transform: scale(0.96);
        }
        .badge-jumlah {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            border: 2px solid #e5e7eb;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .btn-back {
            background: white;
            border-radius: 12px;
            padding: 8px 16px;
            font-weight: 600;
            color: #4f46e5;
            border: 2px solid #e0e7ff;
            transition: all 0.2s;
        }
        .btn-back:hover {
            background: #eef2ff;
            border-color: #818cf8;
        }
        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #e5e7eb;
            border-top: none;
            border-radius: 0 0 12px 12px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 50;
            display: none;
        }
        .suggestions.active {
            display: block;
        }
        .suggestions div {
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.95rem;
        }
        .suggestions div:hover {
            background: #eef2ff;
        }
        .input-wrapper {
            position: relative;
        }
        .tag-offline {
            background: #dbeafe;
            color: #1e40af;
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 600;
            display: inline-block;
        }
        .btn-speak {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            transition: all 0.2s ease;
        }
        .btn-speak:hover {
            background: #e5e7eb;
            border-color: #6366f1;
        }
        .saran-klik {
            color: #4f46e5;
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .saran-klik:hover {
            color: #1e1b4b;
        }
        #saranKata {
            background: #fefce8;
            border: 1px solid #fde68a;
            border-radius: 12px;
            padding: 10px 14px;
            margin-top: 12px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="max-w-3xl mx-auto">

        <!-- TOP BAR -->
        <div class="mb-6 flex flex-wrap justify-between items-center gap-3">
            <a href="index.html" class="btn-back inline-flex items-center gap-1">

                📚 <span id="jumlahKata">0</span> kata &amp; <span id="jumlahFrasa">0</span> frasa
            </div>
        </div>

        <!-- KARTU TRANSLATOR -->
        <div class="bg-white rounded-3xl p-8 shadow-xl border-2 border-indigo-100">

            <!-- Header -->
            <div class="text-center mb-6">
                <h1 class="text-3xl font-extrabold text-gray-800 flex items-center justify-center gap-2 flex-wrap">
                    🌍 <span class="text-indigo-600">Translator</span>
                    <span class="tag-offline">⚡ OFFLINE</span>
                </h1>
                <p class="text-sm text-gray-500 mt-1">Inggris ↔ Indonesia • Bisa terjemahkan kalimat sederhana!</p>
            </div>

            <!-- Mode Arah -->
            <div class="flex items-center justify-between gap-4 mb-6 bg-gray-50 rounded-2xl p-3">
                <div class="flex-1 text-center font-bold text-lg">
                    <span id="labelDari" class="text-indigo-600">🇬🇧 English</span>
                </div>
                <button onclick="swapMode()" class="btn-swap" title="Tukar arah">
                    ⇄
                </button>
                <div class="flex-1 text-center font-bold text-lg">
                    <span id="labelKe" class="text-green-600">🇮🇩 Indonesia</span>
                </div>
            </div>

            <!-- Input -->
            <div class="input-wrapper mb-4">
                <input
                type="text"
                id="inputKata"
                placeholder="Ketik kata, frasa, atau kalimat..."
                class="w-full border-2 border-gray-200 rounded-2xl px-5 py-4 text-lg font-medium transition-all"
                onkeyup="handleInput(this.value)"
                onkeydown="if(event.key==='Enter') terjemahkan()"
                autofocus
                />
                <div id="suggestions" class="suggestions"></div>
            </div>

            <!-- Tombol Terjemahkan -->
            <button onclick="terjemahkan()" class="btn-translate w-full text-white px-6 py-4 rounded-2xl font-bold text-lg inline-flex items-center justify-center gap-2">
                🔍 Terjemahkan
            </button>

            <!-- Hasil -->
            <div id="hasilBox" class="result-box hidden mt-6 p-6 rounded-2xl border-2 border-gray-100 bg-gray-50">
                <div class="flex flex-wrap justify-between items-start gap-4">
                    <div class="flex-1 min-w-[150px]">
                        <div class="text-xs text-gray-400 font-semibold uppercase tracking-wider mb-1">Hasil Terjemahan</div>
                        <div id="hasilTerjemahan" class="text-xl font-bold text-gray-800 leading-relaxed"></div>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="speakText('hasilTerjemahan', 'auto')" class="btn-speak text-gray-600 hover:text-indigo-600 transition text-sm font-semibold flex items-center gap-1 bg-white px-3 py-1.5 rounded-full border border-gray-200">
                            🔊 Baca
                        </button>
                        <button onclick="copyHasil()" class="text-gray-400 hover:text-indigo-600 transition text-sm font-semibold flex items-center gap-1 bg-white px-3 py-1.5 rounded-full border border-gray-200">
                            📋 Salin
                        </button>
                    </div>
                </div>
                <div id="hasilDetail" class="mt-3 text-sm text-gray-500 border-t border-gray-200 pt-3"></div>
            </div>

            <!-- Belum ditemukan + Saran -->
            <div id="tidakDitemukan" class="hidden mt-6 p-6 rounded-2xl border-2 border-yellow-200 bg-yellow-50 text-center">
                <div class="text-4xl mb-2">😅</div>
                <div class="text-lg font-semibold text-gray-700">Kata/frasa belum ada di kamus</div>
                <div class="text-sm text-gray-500 mt-1">Coba gunakan kata yang lebih umum atau periksa ejaan!</div>
                <div id="saranKata" class="hidden text-left"></div>
            </div>

            <!-- Tombol Kontribusi -->
            <div class="mt-6 text-center">
                <button onclick="saranKata()" class="text-sm text-indigo-500 hover:text-indigo-700 font-semibold transition">
                    💡 Ada kata/frasa yang belum ada? Kirim saran!
                </button>
            </div>

        </div>
    </div>

        // ================================================================
        //  3.  FUNGSI UTIL: LEVENSHTEIN DISTANCE (Untuk "Maksudnya ini?")
        // ================================================================
        function levenshteinDist(a, b) {
            const m = a.length,
                n = b.length;
            const dp = Array.from({ length: m + 1 }, (_, i) => i);
            for (let j = 1; j <= n; j++) {
                let prev = dp[0];
                dp[0] = j;
                for (let i = 1; i <= m; i++) {
                    const temp = dp[i];
                    dp[i] = Math.min(
                        prev + (a[i - 1] === b[j - 1] ? 0 : 1),
                        dp[i] + 1,
                        dp[i - 1] + 1
                    );
                    prev = temp;
                }
            }
            return dp[m];
        }

        function cariSaran(kata) {
            const semuaEntri = [];
            // Gabungkan KAMUS dan FRASA
            KAMUS.forEach(item => {
                semuaEntri.push({ teks: item.en, id: item.id, tipe: 'kata' });
                semuaEntri.push({ teks: item.id, id: item.en, tipe: 'kata' });
            });
            FRASA.forEach(item => {
                semuaEntri.push({ teks: item.en, id: item.id, tipe: 'frasa' });
                semuaEntri.push({ teks: item.id, id: item.en, tipe: 'frasa' });
            });

            // Filter unik (case insensitive)
            const uniqueMap = new Map();
            semuaEntri.forEach(e => {
                const key = e.teks.toLowerCase();
                if (!uniqueMap.has(key)) {
                    uniqueMap.set(key, e);
                }
            });

            const uniqueEntries = Array.from(uniqueMap.values());
            const suggestions = [];

            for (const entry of uniqueEntries) {
                const dist = levenshteinDist(kata.toLowerCase(), entry.teks.toLowerCase());
                const threshold = kata.length <= 4 ? 2 : 3;
                if (dist <= threshold && dist > 0) {
                    suggestions.push({ teks: entry.teks, id: entry.id, distance: dist });
                }
            }

            suggestions.sort((a, b) => a.distance - b.distance);
            return suggestions.slice(0, 3); // max 3 saran
        }

            document.getElementById('hasilBox').classList.add('hidden');

        function handleInput(value) {
            const suggestions = document.getElementById('suggestions');
            const trimmed = value.trim().toLowerCase();

            if (trimmed.length < 1) {
                suggestions.classList.remove('active');
                return;
            }

            let hasil = [];
            if (mode === 'en-id') {
                hasil = KAMUS.filter(item => item.en.startsWith(trimmed)).slice(0, 8);
                const frasaHasil = FRASA.filter(item => item.en.startsWith(trimmed)).slice(0, 4);
                hasil = [...hasil, ...frasaHasil];
            } else {
                hasil = KAMUS.filter(item => item.id.startsWith(trimmed)).slice(0, 8);
                const frasaHasil = FRASA.filter(item => item.id.startsWith(trimmed)).slice(0, 4);
                hasil = [...hasil, ...frasaHasil];
            }

            const unique = [];
            const seen = new Set();
            for (const item of hasil) {
                const key = mode === 'en-id' ? item.en : item.id;
                if (!seen.has(key)) {
                    seen.add(key);
                    unique.push(item);
                }
            }
            hasil = unique.slice(0, 8);

            if (hasil.length > 0) {
                suggestions.innerHTML = '';
                hasil.forEach(item => {
                    const div = document.createElement('div');
                    if (mode === 'en-id') {
                        div.textContent = `${item.en} → ${item.id}`;
                    } else {
                        div.textContent = `${item.id} → ${item.en}`;
                    }
                    div.onclick = function() {
                        document.getElementById('inputKata').value = mode === 'en-id' ? item.en : item.id;
                        suggestions.classList.remove('active');
                        terjemahkan();
                    };
                    suggestions.appendChild(div);
                });
                suggestions.classList.add('active');
            } else {
                suggestions.classList.remove('active');
            }
        }

        function speakText(elementId, lang) {
            const el = document.getElementById(elementId);
            const text = el.textContent.trim();
            if (!text) return;

            // Tentukan bahasa berdasarkan mode atau deteksi
            let speechLang = 'id-ID';
            // Jika mode EN->ID, hasilnya ID, tapi user mungkin mau dengar suara asing juga.
            // Biarkan user mendengar teks yang ditampilkan (hasil terjemahan).
            // Tapi kita coba deteksi otomatis: jika ada karakter non-ASCII mungkin ID.
            // Untuk amannya, kita baca sesuai bahasa hasil.
            if (mode === 'en-id') {
                // Hasil adalah Indonesia
                speechLang = 'id-ID';
            } else {
                // Hasil adalah Inggris
                speechLang = 'en-US';
            }

            // Override: jika user minta spesifik lewat parameter (belum diimplementasikan)
            // Kita pakai speechLang yang sudah ditentukan

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = speechLang;
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function terjemahkan() {
            const input = document.getElementById('inputKata');
            const kata = input.value.trim().toLowerCase();
            const hasilBox = document.getElementById('hasilBox');
            const hasilTerjemahan = document.getElementById('hasilTerjemahan');
            const hasilDetail = document.getElementById('hasilDetail');
            const tidakDitemukan = document.getElementById('tidakDitemukan');
            const saranKata = document.getElementById('saranKata');

            if (!kata) {
                alert('Masukkan kata terlebih dahulu!');
                input.focus();
                return;
            }

            let ditemukan = null;

            if (mode === 'en-id') {
                ditemukan = FRASA.find(item => item.en === kata);
                if (!ditemukan) {
                    ditemukan = KAMUS.find(item => item.en === kata);
                }
            } else {
                ditemukan = FRASA.find(item => item.id === kata);
                if (!ditemukan) {
                    ditemukan = KAMUS.find(item => item.id === kata);
                }
            }

            if (ditemukan) {
                hasilBox.classList.remove('hidden');
                tidakDitemukan.classList.add('hidden');
                const hasil = mode === 'en-id' ? ditemukan.id : ditemukan.en;
                hasilTerjemahan.innerHTML = hasil;

                const bahasaAsal = mode === 'en-id' ? '🇬🇧 English' : '🇮🇩 Indonesia';
                const bahasaTujuan = mode === 'en-id' ? '🇮🇩 Indonesia' : '🇬🇧 English';
                hasilDetail.innerHTML =
                    `<span class="font-medium text-gray-600">${bahasaAsal}</span> → <span class="font-medium text-gray-600">${bahasaTujuan}</span>`;

                hasilBox.className =
                    'result-box mt-6 p-6 rounded-2xl border-2 border-indigo-200 bg-indigo-50 fade-in';
            } else {
                hasilBox.classList.add('hidden');
                tidakDitemukan.classList.remove('hidden');

                // Cari saran (did you mean?)
                const saran = cariSaran(kata);
                if (saran.length > 0) {
                    saranKata.classList.remove('hidden');
                    let html = '<div class="text-sm font-semibold text-gray-700 mb-2">🤔 Mungkin maksudnya:</div><div class="flex flex-wrap gap-2">';
                    saran.forEach(s => {
                        const displayText = s.teks;
                        html += `<span class="saran-klik" onclick="document.getElementById('inputKata').value='${displayText}'; document.getElementById('saranKata').classList.add('hidden'); terjemahkan();">${displayText}</span>`;
                    });
                    html += '</div>';
                    saranKata.innerHTML = html;
                } else {
                    saranKata.classList.add('hidden');
                }
            }

            document.getElementById('suggestions').classList.remove('active');
        }

        function copyHasil() {
            const text = document.getElementById('hasilTerjemahan').textContent;
            if (text) {
                navigator.clipboard.writeText(text).then(() => {
                    const btn = event.target;
                    const original = btn.innerHTML;
                    btn.innerHTML = '✅ Tersalin!';
                    setTimeout(() => { btn.innerHTML = original; }, 1500);
                });
            }
        }

        function saranKata() {
            alert('💡 Kirim saran kata ke: support@eng-learn.com\n\nKami akan segera menambahkannya!');
        }

        // ================================================================
        //  5.  TAMPILAN AWAL
        // ================================================================
        document.getElementById('jumlahKata').innerHTML = KAMUS.length;
        document.getElementById('jumlahFrasa').innerHTML = FRASA.length;
        document.getElementById('inputKata').focus();

        document.getElementById('inputKata').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('suggestions').classList.remove('active');
                terjemahkan();
            }
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.input-wrapper')) {
                document.getElementById('suggestions').classList.remove('active');
            }
        });
    </script>
</body>
</html>
