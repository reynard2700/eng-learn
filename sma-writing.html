<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing SMA (Mode Belajar Interaktif) | ENG-LEARN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="min-h-screen p-6 bg-orange-50">
    
    <div class="max-w-3xl mx-auto mb-6 flex justify-between items-center">
        <a href="sma.html" onclick="return confirm('Yakin mau kembali? Poin sesi ini akan hangus lho!')" class="inline-flex items-center text-red-500 hover:text-red-700 font-bold bg-white px-4 py-2 rounded-xl shadow-sm border border-orange-100 transition-all">
            ⬅️ Batal & Kembali
        </a>
        <div class="bg-orange-500 text-white font-bold px-6 py-2 rounded-xl shadow-md flex items-center gap-2 text-lg">
            ⭐ Poin Sesi: <span id="poinSesiTampil">0</span>
        </div>
    </div>

    <div class="max-w-3xl mx-auto bg-white rounded-3xl p-8 shadow-xl border-2 border-orange-50">
        <div class="flex justify-between items-center mb-4 border-b-2 border-orange-100 pb-4">
            <h1 class="text-2xl font-bold text-gray-800">📝 Writing SMA: Connectors</h1>
            <span id="labelNomorSoal" class="bg-orange-100 text-orange-700 font-bold px-4 py-1 rounded-full text-sm">Soal 1 dari 10</span>
        </div>
        
        <div id="kotakMateri" class="mb-6 text-gray-700 text-base bg-orange-50 p-4 rounded-xl border border-orange-100 font-medium"></div>

        <div class="bg-gray-50 p-6 rounded-2xl border-2 border-gray-100">
            <div id="teksSoal" class="text-xl font-medium mb-6 leading-relaxed text-center"></div>
            
            <!-- Area Opsi Pilihan Ganda SMA -->
            <div id="areaPilihan" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6"></div>

            <!-- Tombol Kirim Jawaban -->
            <button id="tombolKirim" onclick="kirimJawaban()" class="w-full bg-orange-500 text-white px-6 py-3 rounded-xl font-bold text-lg hover:bg-orange-600 shadow-md transition-colors mb-4">
                🚀 Kirim Jawaban
            </button>

            <!-- Kotak Hasil -->
            <div id="pesanHasil" class="hidden mb-6 p-4 rounded-xl border-2"></div>

            <!-- Kotak Penjelasan Semua Opsi -->
            <div id="kotakPenjelasanSemua" class="hidden mb-6 p-5 rounded-xl bg-white border-2 border-orange-200 shadow-sm">
                <h3 class="font-bold text-orange-900 mb-3 text-base">📚 Bedah Fungsi Semua Opsi:</h3>
                <div id="isiPenjelasanSemua" class="space-y-3 text-sm text-gray-700"></div>
            </div>

            <!-- Tombol Lanjut -->
            <button id="tombolLanjut" onclick="soalBerikutnya()" class="hidden w-full bg-green-500 text-white px-6 py-4 rounded-xl font-bold text-xl hover:bg-green-600 shadow-md transition-colors">
                ➡️ Lanjut Soal Berikutnya
            </button>

            <!-- Tombol Selesai Sesi -->
            <button id="tombolSelesai" onclick="simpanPoinDanSelesai()" class="hidden mt-6 w-full bg-green-600 text-white px-6 py-4 rounded-xl font-bold text-xl hover:bg-green-700 shadow-lg">
                🎉 Selesai & Simpan Poin!
            </button>
        </div>
    </div>

    <script>
        const daftarSoal = [
            {
                materi: "💡 Teori: Mempelajari kata hubung penanda hubungan sebab-akibat formal dalam esai.",
                depan: "It was raining heavily,",
                belakang: "we canceled the match.",
                pilihan: ["therefore", "however", "furthermore", "meanwhile"],
                kunci: "therefore",
                penjelasan: {
                    "therefore": "<b>Therefore:</b> BENAR! Digunakan untuk menarik kesimpulan logis atau menyatakan akibat langsung.",
                    "however": "<b>However:</b> Salah. Dipakai untuk menyatakan pertentangan/kontras.",
                    "furthermore": "<b>Furthermore:</b> Salah. Dipakai untuk menambah argumen pendukung.",
                    "meanwhile": "<b>Meanwhile:</b> Salah. Menunjukkan dua kejadian yang berlangsung bersamaan."
                }
            },
            {
                materi: "💡 Teori: Mempelajari kata hubung penanda kontras atau hasil yang tidak terduga.",
                depan: "She studied hard;",
                belakang: "she failed the exam.",
                pilihan: ["therefore", "however", "moreover", "instead"],
                kunci: "however",
                penjelasan: {
                    "therefore": "<b>Therefore:</b> Salah. Kalau ini, mestinya dia lulus ujian karena belajar giat.",
                    "however": "<b>However:</b> BENAR! Tepat untuk menunjukkan kontras yang mengejutkan (sudah belajar tapi tetap gagal).",
                    "moreover": "<b>Moreover:</b> Salah. Hanya untuk menambah informasi senada.",
                    "instead": "<b>Instead:</b> Salah. Menunjukkan alternatif pilihan pengganti."
                }
            },
            {
                materi: "💡 Teori: Penambahan informasi atau argumen pendukung yang memperkuat poin.",
                depan: "The hotel is cheap;",
                belakang: ", it is very clean.",
                pilihan: ["otherwise", "however", "furthermore", "consequently"],
                kunci: "furthermore",
                penjelasan: {
                    "otherwise": "<b>Otherwise:</b> Salah. Menyangkut peringatan kondisi sebaliknya.",
                    "however": "<b>However:</b> Salah. Ini bukan kalimat yang saling bertentangan.",
                    "furthermore": "<b>Furthermore:</b> BENAR! Dipakai untuk menambah kelebihan lain (selain murah, hotelnya juga bersih).",
                    "consequently": "<b>Consequently:</b> Salah. Bersih bukanlah konsekuensi langsung dari murah."
                }
            },
            {
                materi: "💡 Teori: Menyatakan dua aktivitas berbeda yang terjadi secara bersamaan.",
                depan: "John cooked dinner;",
                belakang: ", Mary cleaned the room.",
                pilihan: ["meanwhile", "therefore", "instead", "nevertheless"],
                kunci: "meanwhile",
                penjelasan: {
                    "meanwhile": "<b>Meanwhile:</b> BENAR! Menunjukkan dua orang melakukan hal berbeda di waktu yang sama.",
                    "therefore": "<b>Therefore:</b> Salah. Memasak tidak disebabkan oleh membersihkan ruangan.",
                    "instead": "<b>Instead:</b> Salah. Mary membersihkan bukan sebagai pengganti John memasak.",
                    "nevertheless": "<b>Nevertheless:</b> Salah. Ini bukan kalimat pertentangan rintangan."
                }
            },
            {
                materi: "💡 Teori: Penguatan argumen atau penambahan alasan negatif yang senada.",
                depan: "The car is expensive;",
                belakang: ", it consumes too much fuel.",
                pilihan: ["however", "moreover", "otherwise", "therefore"],
                kunci: "moreover",
                penjelasan: {
                    "however": "<b>However:</b> Salah. Kedua klausa ini sifatnya mendukung argumen negatif yang sama.",
                    "moreover": "<b>Moreover:</b> BENAR! Dipakai untuk menumpuk poin negatif tambahan (selain mahal, boros bensin pula).",
                    "otherwise": "<b>Otherwise:</b> Salah. Tidak ada unsur pengandaian.",
                    "therefore": "<b>Therefore:</b> Salah. Boros bensin bukan kesimpulan formal dari harga."
                }
            },
            {
                materi: "💡 Teori: Konsekuensi mutlak atau hukuman dari tindakan di klausa pertama.",
                depan: "He broke the rules;",
                belakang: ", he was expelled.",
                pilihan: ["consequently", "meanwhile", "furthermore", "instead"],
                kunci: "consequently",
                penjelasan: {
                    "consequently": "<b>Consequently:</b> BENAR! Menunjukkan konsekuensi hukum/aturan yang pasti terjadi.",
                    "meanwhile": "<b>Meanwhile:</b> Salah. Dikeluarkan bukan terjadi bersamaan dengan melanggar.",
                    "furthermore": "<b>Furthermore:</b> Salah. Ini bukan sekadar penambahan informasi biasa.",
                    "instead": "<b>Instead:</b> Salah. Dikeluarkan adalah hukuman, bukan opsi alternatif."
                }
            },
            {
                materi: "💡 Teori: Menunjukkan tindakan alternatif sebagai pilihan pengganti.",
                depan: "He didn't quit;",
                belakang: ", he fought harder.",
                pilihan: ["therefore", "otherwise", "instead", "however"],
                kunci: "instead",
                penjelasan: {
                    "therefore": "<b>Therefore:</b> Salah. Berjuang bukan kesimpulan logis dari tidak menyerah.",
                    "otherwise": "<b>Otherwise:</b> Salah. Ini bukan kalimat peringatan.",
                    "instead": "<b>Instead:</b> BENAR! Menunjukkan pilihan aksi lain yang diambil sebagai pengganti.",
                    "however": "<b>However:</b> Kurang tepat dibanding 'instead' yang spesifik menunjukkan alternatif."
                }
            },
            {
                materi: "💡 Teori: Kalimat pengandaian yang menyatakan ancaman atau hal buruk jika diabaikan.",
                depan: "Hurry up;",
                belakang: ", we will miss the train.",
                pilihan: ["furthermore", "otherwise", "meanwhile", "consequently"],
                kunci: "otherwise",
                penjelasan: {
                    "furthermore": "<b>Furthermore:</b> Salah. Ketinggalan kereta bukan argumen penambah yang positif.",
                    "otherwise": "<b>Otherwise:</b> BENAR! Memperingatkan konsekuensi buruk jika tidak segera bergegas.",
                    "meanwhile": "<b>Meanwhile:</b> Salah. Waktu kejadiannya tidak paralel.",
                    "consequently": "<b>Consequently:</b> Kurang natural dibanding 'otherwise' untuk peringatan bersyarat."
                }
            },
            {
                materi: "💡 Teori: Pertentangan kuat yang menyatakan 'meskipun ada rintangan tersebut'.",
                depan: "The task was difficult;",
                belakang: ", they finished it on time.",
                pilihan: ["nevertheless", "instead", "therefore", "moreover"],
                kunci: "nevertheless",
                penjelasan: {
                    "nevertheless": "<b>Nevertheless:</b> BENAR! Sangat cocok untuk menunjukkan keberhasilan di tengah kesulitan.",
                    "instead": "<b>Instead:</b> Salah. Menyelesaikan tugas bukan opsi alternatif dari kesulitan.",
                    "therefore": "<b>Therefore:</b> Salah. Selesai tepat waktu bukan disebabkan oleh sulitnya tugas.",
                    "moreover": "<b>Moreover:</b> Salah. Ini adalah kalimat kontras."
                }
            },
            {
                materi: "💡 Teori: Penambahan informasi atau poin argumen baru dalam esai.",
                depan: "Smoking is bad for health;",
                belakang: ", it wastes money.",
                pilihan: ["in addition", "otherwise", "meanwhile", "however"],
                kunci: "in addition",
                penjelasan: {
                    "in addition": "<b>In addition:</b> BENAR! Dipakai untuk menumpuk kerugian lain dari merokok.",
                    "otherwise": "<b>Otherwise:</b> Salah. Ini bukan kalimat peringatan bersyarat.",
                    "meanwhile": "<b>Meanwhile:</b> Salah. Tidak ada kaitan dengan waktu bersamaan.",
                    "however": "<b>However:</b> Salah. Boros uang dan merusak kesehatan adalah hal yang senada."
                }
            }
        ];

        let indeksSoalAktif = 0;
        let poinSesi = 0;
        let pilihanDipilih = null;
        let sudahDijawabBenar = false;

        function muatSoal() {
            let soal = daftarSoal[indeksSoalAktif];
            document.getElementById("labelNomorSoal").innerHTML = `Soal ${indeksSoalAktif + 1} dari 10`;
            document.getElementById("kotakMateri").innerHTML = soal.materi;
            document.getElementById("teksSoal").innerHTML = `"${soal.depan} <span class='text-orange-600 font-bold underline bg-orange-100 px-2 py-1 rounded'>[ ... ]</span> ${soal.belakang}"`;
            
            let areaPilihan = document.getElementById("areaPilihan");
            areaPilihan.innerHTML = "";
            pilihanDipilih = null;
            sudahDijawabBenar = false;

            soal.pilihan.forEach(opsi => {
                let tombol = document.createElement("button");
                tombol.innerHTML = opsi;
                tombol.id = "opsi-" + opsi;
                tombol.className = "bg-white border-2 border-orange-200 text-orange-700 font-bold py-4 rounded-xl shadow-sm hover:bg-orange-50 hover:border-orange-400 transition-all text-xl capitalize";
                tombol.onclick = function() { pilihOpsi(opsi); };
                areaPilihan.appendChild(tombol);
            });

            document.getElementById("pesanHasil").classList.add("hidden");
            document.getElementById("kotakPenjelasanSemua").classList.add("hidden");
            document.getElementById("tombolLanjut").classList.add("hidden");
            document.getElementById("tombolKirim").classList.remove("hidden");
        }

        function pilihOpsi(opsi) {
            pilihanDipilih = opsi;
            let soal = daftarSoal[indeksSoalAktif];
            soal.pilihan.forEach(o => {
                let btn = document.getElementById("opsi-" + o);
                if (o === opsi) {
                    btn.className = "bg-orange-500 border-2 border-orange-600 text-white font-bold py-4 rounded-xl shadow-md transition-all text-xl capitalize";
                } else {
                    btn.className = "bg-white border-2 border-orange-200 text-orange-700 font-bold py-4 rounded-xl shadow-sm hover:bg-orange-50 transition-all text-xl capitalize";
                }
            });
        }

        function kirimJawaban() {
            if (!pilihanDipilih) {
                alert("Pilih salah satu opsi jawaban terlebih dahulu ya mase!");
                return;
            }

            let soalAktif = daftarSoal[indeksSoalAktif];
            let pesan = document.getElementById("pesanHasil");
            pesan.classList.remove("hidden");

            // Tampilkan kotak penjelasan semua opsi
            let kotakPenjelasan = document.getElementById("kotakPenjelasanSemua");
            let isiPenjelasan = document.getElementById("isiPenjelasanSemua");
            kotakPenjelasan.classList.remove("hidden");

            let htmlSemua = "";
            for (let key in soalAktif.penjelasan) {
                let statusWarna = (key === soalAktif.kunci) ? "text-green-700 font-bold bg-green-50 p-2 rounded" : "text-gray-600 bg-gray-50 p-2 rounded";
                htmlSemua += `<div class="${statusWarna}">• ${soalAktif.penjelasan[key]}</div>`;
            }
            isiPenjelasan.innerHTML = htmlSemua;

            if (pilihanDipilih === soalAktif.kunci) {
                pesan.innerHTML = `🎉 <b>Tepat sekali! Pilihanmu benar.</b> Lihat rincian fungsi setiap opsi di bawah ya!`;
                pesan.className = "mb-4 p-4 rounded-xl border-2 bg-green-50 text-green-800 border-green-200 text-base";
                
                if (!sudahDijawabBenar) {
                    poinSesi += 20;
                    document.getElementById("poinSesiTampil").innerHTML = poinSesi;
                    sudahDijawabBenar = true;
                }

                document.getElementById("tombolKirim").classList.add("hidden");
                if (indeksSoalAktif < daftarSoal.length - 1) {
                    document.getElementById("tombolLanjut").classList.remove("hidden");
                } else {
                    document.getElementById("tombolSelesai").classList.remove("hidden");
                }
            } else {
                pesan.innerHTML = `⚠️ <b>Kurang tepat.</b> Pilihanmu belum benar, tapi tenang! Cek fungsi semua opsi di bawah untuk memperdalam pemahamanmu.`;
                pesan.className = "mb-4 p-4 rounded-xl border-2 bg-red-50 text-red-800 border-red-200 text-base";
            }
        }

        function soalBerikutnya() {
            indeksSoalAktif++;
            muatSoal();
        }

        function simpanPoinDanSelesai() {
            let poinTotalLama = parseInt(localStorage.getItem('poinMurid')) || 0;
            localStorage.setItem('poinMurid', poinTotalLama + poinSesi);
            window.location.href = "sma.html";
        }

        muatSoal();
    </script>
</body>
</html>
