<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Challenge | ENG-LEARN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }
        body {
            min-height: 100vh;
            padding: 1.5rem;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
        }
        .max-w-3xl {
            max-width: 48rem;
            margin-left: auto;
            margin-right: auto;
        }
        .option-btn {
            transition: all 0.2s ease;
            border: 2px solid #e5e7eb;
            background: white;
            padding: 16px 12px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1rem;
            min-height: 56px;
            cursor: pointer;
            text-align: center;
        }
        .option-btn:hover {
            border-color: #f59e0b;
            background: #fffbeb;
        }
        .option-btn.correct {
            border-color: #22c55e;
            background: #dcfce7;
        }
        .option-btn.wrong {
            border-color: #ef4444;
            background: #fee2e2;
        }
        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.7;
        }
        .option-btn.selected {
            border-color: #f59e0b;
            background: #fef3c7;
        }
        @media (max-width: 640px) {
            .option-btn {
                font-size: 0.85rem !important;
                padding: 14px 10px !important;
                min-height: 50px !important;
            }
            .bg-white.rounded-3xl {
                padding: 16px !important;
            }
            #teksSoal {
                font-size: 1.2rem !important;
            }
            .max-w-3xl.mx-auto.mb-6.flex.justify-between {
                flex-wrap: wrap !important;
                gap: 12px !important;
            }
            #tombolLanjut,
            #tombolSelesai {
                padding: 16px !important;
                font-size: 1rem !important;
                min-height: 56px !important;
            }
            .flex.gap-3 {
                flex-direction: column !important;
                gap: 10px !important;
            }
        }
        button:active {
            transform: scale(0.96);
        }
        .badge-daily {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #fbbf24;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.2);
        }
        .btn-back {
            background: white;
            border-radius: 12px;
            padding: 8px 16px;
            font-weight: 600;
            color: #d97706;
            border: 2px solid #fde68a;
            transition: all 0.2s;
        }
        .btn-back:hover {
            background: #fffbeb;
        }
        .hasil-box {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="max-w-3xl mx-auto">

        <!-- TOP BAR -->
        <div class="mb-6 flex flex-wrap justify-between items-center gap-3">
            <a href="index.html" onclick="return confirm('Kak, yakin mau kembali? Poin sesi ini akan hangus lho!')" class="btn-back inline-flex items-center gap-1">
                ⬅️ Kembali
            </a>
            <div class="bg-yellow-500 text-white font-bold px-6 py-2 rounded-xl shadow-md flex items-center gap-2 text-lg">
                ⭐ Poin Total: <span id="poinTotal">0</span>
            </div>
        </div>

        <!-- KARTU CHALLENGE -->
        <div class="bg-white rounded-3xl p-8 shadow-xl border-2 border-yellow-200">

            <div class="flex flex-wrap justify-between items-center mb-4 border-b-2 border-yellow-100 pb-4">
                <h1 class="text-2xl font-extrabold text-gray-800 flex items-center gap-2">
                    🌟 Daily <span class="text-yellow-500">Challenge</span>
                </h1>
                <div class="flex items-center gap-2">
                    <span class="bg-yellow-100 text-yellow-700 font-bold px-4 py-1 rounded-full text-sm">
                        📅 Hari ini
                    </span>
                    <span id="tanggalHariIni" class="text-sm font-semibold text-gray-500"></span>
                </div>
            </div>

            <!-- Status Challenge -->
            <div id="statusChallenge" class="badge-daily rounded-xl p-4 mb-6 text-center">
                <div id="statusText" class="font-bold text-gray-700">Memuat soal hari ini...</div>
            </div>

            <!-- Area Soal -->
            <div id="areaSoal" class="fade-in hidden">
                <div id="teksSoal" class="text-2xl font-bold text-center text-gray-800 mb-6">
                    Loading...
                </div>
                <div id="areaPilihan" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6"></div>
            </div>

            <!-- Tombol Lanjut / Selesai -->
            <button id="tombolLanjut" onclick="soalBerikutnya()" class="hidden w-full bg-yellow-500 text-white px-6 py-4 rounded-xl font-bold text-lg hover:bg-yellow-600 shadow-md transition-colors">
                ➡️ Lanjut Soal Berikutnya
            </button>

            <button id="tombolSelesai" onclick="simpanPoinDanSelesai()" class="hidden w-full bg-yellow-600 text-white px-6 py-4 rounded-xl font-bold text-lg hover:bg-yellow-700 shadow-md transition-colors">
                🎉 Selesai! Simpan Poin
            </button>

            <!-- Feedback -->
            <div id="pesanHasil" class="hidden mt-4 p-4 rounded-xl border-2 text-center font-bold text-lg"></div>

            <!-- SKOR AKHIR -->
            <div id="hasilSkor" class="hidden mt-6 p-6 rounded-2xl border-2 border-yellow-200 bg-yellow-50 text-center hasil-box">
                <div class="text-4xl mb-2">🎉</div>
                <h2 class="text-2xl font-extrabold text-gray-800 mb-2">Selesai!</h2>
                <div class="text-3xl font-extrabold text-yellow-600 mb-2">
                    <span id="skorBenar">0</span> dari <span id="skorTotal">0</span>
                    <span id="skorPersen" class="text-lg font-semibold text-gray-500">(0%)</span>
                </div>
                <div class="flex justify-center gap-6 text-sm text-gray-600 mb-4">
                    <div>✅ Benar: <span id="benarCount" class="font-bold text-green-600">0</span></div>
                    <div>❌ Salah: <span id="salahCount" class="font-bold text-red-600">0</span></div>
                </div>
                <div class="text-sm text-gray-500 mb-4">
                    💡 Poin yang didapat: <span id="skorPoinAkhir" class="font-bold text-yellow-600">0</span>
                    <br />
                    <span class="text-xs text-green-600">+50 Bonus Daily Challenge!</span>
                </div>
                <a href="index.html" class="inline-block bg-yellow-600 text-white px-6 py-3 rounded-full font-bold hover:bg-yellow-700 transition shadow-md">
                    🏠 Kembali ke Home
                </a>
            </div>

        </div>
    </div>

    <script>
        // ================================================================
        //  1.  MASTER BANK SOAL (100+ Soal)
        // ================================================================
        const MASTER_SOAL = [
            // VOCABULARY
            { tipe: "vocab", word: "abandon", meaning: "meninggalkan" },
            { tipe: "vocab", word: "ability", meaning: "kemampuan" },
            { tipe: "vocab", word: "abroad", meaning: "di luar negeri" },
            { tipe: "vocab", word: "absorb", meaning: "menyerap" },
            { tipe: "vocab", word: "accelerate", meaning: "mempercepat" },
            { tipe: "vocab", word: "accomplish", meaning: "mencapai" },
            { tipe: "vocab", word: "accurate", meaning: "akurat" },
            { tipe: "vocab", word: "achieve", meaning: "meraih" },
            { tipe: "vocab", word: "adapt", meaning: "beradaptasi" },
            { tipe: "vocab", word: "adjust", meaning: "menyesuaikan" },
            { tipe: "vocab", word: "admire", meaning: "mengagumi" },
            { tipe: "vocab", word: "admit", meaning: "mengakui" },
            { tipe: "vocab", word: "adopt", meaning: "mengadopsi" },
            { tipe: "vocab", word: "advance", meaning: "kemajuan" },
            { tipe: "vocab", word: "advise", meaning: "menasihati" },
            { tipe: "vocab", word: "affect", meaning: "mempengaruhi" },
            { tipe: "vocab", word: "afford", meaning: "mampu" },
            { tipe: "vocab", word: "aggressive", meaning: "agresif" },
            { tipe: "vocab", word: "allow", meaning: "mengizinkan" },
            { tipe: "vocab", word: "amaze", meaning: "mengagumkan" },
            { tipe: "vocab", word: "analyze", meaning: "menganalisis" },
            { tipe: "vocab", word: "announce", meaning: "mengumumkan" },
            { tipe: "vocab", word: "anxious", meaning: "cemas" },
            { tipe: "vocab", word: "apologize", meaning: "meminta maaf" },
            { tipe: "vocab", word: "appear", meaning: "muncul" },
            { tipe: "vocab", word: "appreciate", meaning: "menghargai" },
            { tipe: "vocab", word: "approach", meaning: "pendekatan" },
            { tipe: "vocab", word: "assume", meaning: "berasumsi" },
            { tipe: "vocab", word: "attract", meaning: "menarik" },
            { tipe: "vocab", word: "avoid", meaning: "menghindari" },
            { tipe: "vocab", word: "aware", meaning: "sadar" },
            { tipe: "vocab", word: "balance", meaning: "keseimbangan" },
            { tipe: "vocab", word: "barrier", meaning: "hambatan" },
            { tipe: "vocab", word: "benefit", meaning: "manfaat" },
            { tipe: "vocab", word: "blame", meaning: "menyalahkan" },
            { tipe: "vocab", word: "boost", meaning: "meningkatkan" },
            { tipe: "vocab", word: "brief", meaning: "singkat" },
            { tipe: "vocab", word: "brilliant", meaning: "cemerlang" },
            { tipe: "vocab", word: "capable", meaning: "mampu" },
            { tipe: "vocab", word: "celebrate", meaning: "merayakan" },
            { tipe: "vocab", word: "challenge", meaning: "tantangan" },
            { tipe: "vocab", word: "combine", meaning: "menggabungkan" },
            { tipe: "vocab", word: "comfortable", meaning: "nyaman" },
            { tipe: "vocab", word: "commit", meaning: "berkomitmen" },
            { tipe: "vocab", word: "compete", meaning: "bersaing" },
            { tipe: "vocab", word: "confident", meaning: "percaya diri" },
            { tipe: "vocab", word: "confuse", meaning: "membingungkan" },
            { tipe: "vocab", word: "consider", meaning: "mempertimbangkan" },
            { tipe: "vocab", word: "convince", meaning: "meyakinkan" },
            { tipe: "vocab", word: "courage", meaning: "keberanian" },
            { tipe: "vocab", word: "creative", meaning: "kreatif" },
            // GRAMMAR
            { tipe: "grammar", soal: "She ___ to school every day.", opsi: ["go", "goes", "going", "went"], kunci: "goes" },
            { tipe: "grammar", soal: "They ___ a movie right now.", opsi: ["watch", "watches", "watching", "are watching"], kunci: "are watching" },
            { tipe: "grammar", soal: "I ___ to Bali last year.", opsi: ["go", "went", "have gone", "will go"], kunci: "went" },
            { tipe: "grammar", soal: "We ___ a new house next year.", opsi: ["buy", "bought", "will buy", "are buying"], kunci: "will buy" },
            { tipe: "grammar", soal: "The book is ___ the table.", opsi: ["in", "on", "at", "to"], kunci: "on" },
            { tipe: "grammar", soal: "There are three ___ in the basket.", opsi: ["apple", "apples", "apple's", "appless"], kunci: "apples" },
            { tipe: "grammar", soal: "I ___ to that museum before.", opsi: ["go", "went", "have gone", "have been"], kunci: "have been" },
            { tipe: "grammar", soal: "You ___ bring an umbrella today.", opsi: ["must", "can", "should", "might"], kunci: "should" },
            { tipe: "grammar", soal: "She wants to be ___ engineer.", opsi: ["a", "an", "the", "none"], kunci: "an" },
            { tipe: "grammar", soal: "___ you like to dance?", opsi: ["Are", "Do", "Does", "Is"], kunci: "Do" },
            { tipe: "grammar", soal: "I ___ a dedicated student.", opsi: ["am", "is", "are", "be"], kunci: "am" },
            { tipe: "grammar", soal: "___ she reading a book now?", opsi: ["Is", "Are", "Do", "Does"], kunci: "Is" },
            { tipe: "grammar", soal: "She ___ an apple this morning.", opsi: ["eat", "ate", "eaten", "eats"], kunci: "ate" },
            { tipe: "grammar", soal: "We ___ visit grandma next week.", opsi: ["go", "went", "will go", "are going to"], kunci: "are going to" },
            { tipe: "grammar", soal: "If I ___ you, I would accept it.", opsi: ["am", "was", "were", "have been"], kunci: "were" },
            // IDIOM
            { tipe: "idiom", phrase: "Break a leg", meaning: "Semoga sukses!" },
            { tipe: "idiom", phrase: "Piece of cake", meaning: "Sangat mudah" },
            { tipe: "idiom", phrase: "Hit the books", meaning: "Belajar giat" },
            { tipe: "idiom", phrase: "Let the cat out of the bag", meaning: "Membocorkan rahasia" },
            { tipe: "idiom", phrase: "Under the weather", meaning: "Sedang sakit" },
            { tipe: "idiom", phrase: "Once in a blue moon", meaning: "Jarang sekali" },
            { tipe: "idiom", phrase: "Cost an arm and a leg", meaning: "Sangat mahal" },
            { tipe: "idiom", phrase: "Bite the bullet", meaning: "Menghadapi situasi sulit" },
            { tipe: "idiom", phrase: "Go the extra mile", meaning: "Berusaha ekstra" },
            { tipe: "idiom", phrase: "Keep an eye on", meaning: "Mengawasi" },
            { tipe: "idiom", phrase: "Spill the beans", meaning: "Membocorkan rahasia" },
            { tipe: "idiom", phrase: "Hit the nail on the head", meaning: "Tepat sekali" },
            { tipe: "idiom", phrase: "Burn the midnight oil", meaning: "Belajar larut malam" },
            { tipe: "idiom", phrase: "Pull someone's leg", meaning: "Bercanda" },
            { tipe: "idiom", phrase: "Cry over spilt milk", meaning: "Menyesali hal yang sudah terjadi" },
        ];

        // ================================================================
        //  2.  SEEDED RANDOM (biar tiap hari beda)
        // ================================================================
        function getDateSeed() {
            const today = new Date();
            const y = today.getFullYear();
            const m = String(today.getMonth() + 1).padStart(2, '0');
            const d = String(today.getDate()).padStart(2, '0');
            return parseInt(y + m + d);
        }

        function seededRandom(seed) {
            return function() {
                seed |= 0;
                seed = seed + 0x6D2B79F5 | 0;
                let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        function shuffleArray(array, seed) {
            const rand = seededRandom(seed);
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(rand() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getDailyQuestions() {
            const seed = getDateSeed();
            const shuffled = shuffleArray(MASTER_SOAL, seed);
            return shuffled.slice(0, 10);
        }

        // ================================================================
        //  3.  STATE & LOGIC
        // ================================================================
        let sesiSoal = [];
        let indeksAktif = 0;
        let skorSesi = 0;
        let sudahDijawab = false;
        let statusRiwayat = {};
        const MAX_SOAL = 10;
        const TODAY_KEY = "daily_done_" + new Date().toISOString().split('T')[0];

        function renderSoal(soal, index) {
            const container = document.getElementById('areaSoal');
            const teksSoal = document.getElementById('teksSoal');
            const areaPilihan = document.getElementById('areaPilihan');

            container.classList.remove('hidden');
            areaPilihan.innerHTML = '';
            document.getElementById('pesanHasil').classList.add('hidden');
            document.getElementById('tombolLanjut').classList.add('hidden');
            document.getElementById('tombolSelesai').classList.add('hidden');
            document.getElementById('hasilSkor').classList.add('hidden');
            sudahDijawab = false;

            let pertanyaan = '';
            let opsi = [];
            let kunci = '';

            if (soal.tipe === 'vocab') {
                pertanyaan = 'Apa arti dari kata <span class="text-yellow-600 font-extrabold">"' + soal.word + '"</span> ?';
                const semuaArti = MASTER_SOAL.filter(s => s.tipe === 'vocab' || s.tipe === 'idiom')
                    .map(s => s.meaning || s.phrase)
                    .filter(m => m !== soal.meaning);
                const shuffledArti = shuffleArray(semuaArti, getDateSeed() + index + 100);
                const pilihanSalah = shuffledArti.slice(0, 3);
                opsi = [soal.meaning, ...pilihanSalah];
                opsi = shuffleArray(opsi, getDateSeed() + index + 200);
                kunci = soal.meaning;
            } else if (soal.tipe === 'idiom') {
                pertanyaan = 'Apa arti dari idiom <span class="text-yellow-600 font-extrabold">"' + soal.phrase + '"</span> ?';
                const semuaArti = MASTER_SOAL.filter(s => s.tipe === 'vocab' || s.tipe === 'idiom')
                    .map(s => s.meaning || s.phrase)
                    .filter(m => m !== soal.meaning);
                const shuffledArti = shuffleArray(semuaArti, getDateSeed() + index + 300);
                const pilihanSalah = shuffledArti.slice(0, 3);
                opsi = [soal.meaning, ...pilihanSalah];
                opsi = shuffleArray(opsi, getDateSeed() + index + 400);
                kunci = soal.meaning;
            } else if (soal.tipe === 'grammar') {
                pertanyaan = 'Lengkapi kalimat: <span class="text-yellow-600 font-extrabold">"' + soal.soal + '"</span>';
                opsi = soal.opsi;
                kunci = soal.kunci;
            }

            teksSoal.innerHTML = pertanyaan;

            opsi.forEach((pilihan) => {
                const btn = document.createElement('button');
                btn.innerHTML = pilihan;
                btn.className = 'option-btn';
                btn.dataset.value = pilihan;
                btn.onclick = function() { pilihJawaban(this, pilihan, kunci); };
                areaPilihan.appendChild(btn);
            });
        }

        function pilihJawaban(btn, dipilih, kunciBenar) {
            if (sudahDijawab) return;
            sudahDijawab = true;

            const semuaBtn = document.querySelectorAll('.option-btn');
            semuaBtn.forEach(b => b.classList.add('disabled'));

            const isBenar = (dipilih === kunciBenar);
            const pesan = document.getElementById('pesanHasil');
            pesan.classList.remove('hidden');

            semuaBtn.forEach(b => {
                if (b.dataset.value === kunciBenar) {
                    b.classList.add('correct');
                } else if (b === btn && !isBenar) {
                    b.classList.add('wrong');
                }
            });

            if (isBenar) {
                skorSesi += 10;
                statusRiwayat[indeksAktif] = { sudahBenar: true };
                pesan.innerHTML = "✅ <b>Benar!</b> +10 poin";
                pesan.className = 'mt-4 p-4 rounded-xl border-2 border-green-200 bg-green-50 text-green-700 text-center font-bold text-lg';
            } else {
                statusRiwayat[indeksAktif] = { sudahBenar: false };
                pesan.innerHTML = '❌ <b>Kurang tepat.</b> Jawaban: <span class="font-bold text-green-600">"' + kunciBenar + '"</span>';
                pesan.className = 'mt-4 p-4 rounded-xl border-2 border-red-200 bg-red-50 text-red-700 text-center font-bold text-lg';
            }

            if (indeksAktif < MAX_SOAL - 1) {
                document.getElementById('tombolLanjut').classList.remove('hidden');
            } else {
                document.getElementById('tombolSelesai').classList.remove('hidden');
            }
        }

        function soalBerikutnya() {
            indeksAktif++;
            renderSoal(sesiSoal[indeksAktif], indeksAktif);
        }

        function simpanPoinDanSelesai() {
            localStorage.setItem(TODAY_KEY, 'true');
            let totalSoal = sesiSoal.length;
            let benar = 0;
            for (let i = 0; i < totalSoal; i++) {
                if (statusRiwayat[i] && statusRiwayat[i].sudahBenar) benar++;
            }

            document.getElementById("hasilSkor").classList.remove("hidden");
            document.getElementById("skorBenar").innerHTML = benar;
            document.getElementById("skorTotal").innerHTML = totalSoal;
            document.getElementById("benarCount").innerHTML = benar;
            document.getElementById("salahCount").innerHTML = totalSoal - benar;
            document.getElementById("skorPoinAkhir").innerHTML = skorSesi;
            let persen = Math.round((benar / totalSoal) * 100);
            document.getElementById("skorPersen").innerHTML = "(" + persen + "%)";
            document.getElementById("tombolSelesai").classList.add("hidden");
            document.getElementById("areaSoal").classList.add("hidden");

            const poinTotalLama = parseInt(localStorage.getItem('poinMurid')) || 0;
            localStorage.setItem('poinMurid', poinTotalLama + skorSesi + 50);
        }

        function initDaily() {
            document.getElementById('poinTotal').innerHTML = parseInt(localStorage.getItem('poinMurid')) || 0;
            const today = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('tanggalHariIni').innerHTML = today.toLocaleDateString('id-ID', options);

            const sudahSelesai = localStorage.getItem(TODAY_KEY);
            const statusText = document.getElementById('statusText');

            if (sudahSelesai) {
                statusText.innerHTML = '✅ <span class="text-green-600">Kamu sudah menyelesaikan Daily Challenge hari ini!</span><br> <span class="text-sm font-normal text-gray-500">Kembali lagi besok untuk tantangan baru 🚀</span>';
                document.getElementById('areaSoal').classList.add('hidden');
                document.getElementById('tombolSelesai').classList.add('hidden');
                document.getElementById('tombolLanjut').classList.add('hidden');
                return;
            }

            statusText.innerHTML = '🔥 <span class="text-yellow-600">Tantangan hari ini siap!</span> Jawab 10 soal dengan benar untuk mendapatkan poin + bonus 50!';
            sesiSoal = getDailyQuestions();
            indeksAktif = 0;
            skorSesi = 0;
            statusRiwayat = {};
            renderSoal(sesiSoal[0], 0);
        }

        initDaily();
    </script>
</body>
</html>
