<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Writing SMP (20 Soal) | ENG-LEARN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }
        body {
            min-height: 100vh;
            padding: 1.5rem;
            background-color: #eff6ff;
        }
        .max-w-3xl {
            max-width: 48rem;
            margin-left: auto;
            margin-right: auto;
        }
        .option-btn {
            transition: all 0.2s ease;
            border: 2px solid #e5e7eb;
            background: white;
            padding: 16px 12px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1rem;
            min-height: 56px;
            cursor: pointer;
            text-align: center;
        }
        .option-btn:hover {
            border-color: #6366f1;
            background: #eef2ff;
        }
        .option-btn.correct {
            border-color: #22c55e;
            background: #dcfce7;
        }
        .option-btn.wrong {
            border-color: #ef4444;
            background: #fee2e2;
        }
        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.7;
        }
        .option-btn.selected {
            border-color: #6366f1;
            background: #eef2ff;
        }
        @media (max-width: 640px) {
            .option-btn {
                font-size: 0.85rem !important;
                padding: 14px 8px !important;
                min-height: 50px !important;
            }
            .bg-white.rounded-3xl {
                padding: 16px !important;
            }
            #teksSoal {
                font-size: 1rem !important;
            }
            .max-w-3xl.mx-auto.mb-6.flex.justify-between {
                flex-wrap: wrap !important;
                gap: 12px !important;
            }
            #tombolKirim,
            #tombolLanjut,
            #tombolSelesai {
                padding: 16px !important;
                font-size: 1rem !important;
                min-height: 56px !important;
            }
            .flex.gap-3 {
                flex-direction: column !important;
                gap: 10px !important;
            }
        }
        button:active {
            transform: scale(0.96);
        }
        .btn-back {
            background: white;
            border-radius: 12px;
            padding: 8px 16px;
            font-weight: 600;
            color: #4f46e5;
            border: 2px solid #e0e7ff;
            transition: all 0.2s;
        }
        .btn-back:hover {
            background: #eef2ff;
        }
        .hasil-box {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="max-w-3xl mx-auto">

        <!-- TOP BAR -->
        <div class="mb-6 flex flex-wrap justify-between items-center gap-3">
            <a href="smp.html" onclick="return confirm('Kak, yakin mau kembali? Poin sesi ini akan hangus lho!')" class="btn-back inline-flex items-center gap-1">
                ⬅️ Batal & Kembali
            </a>
            <div class="bg-blue-500 text-white font-bold px-6 py-2 rounded-xl shadow-md flex items-center gap-2 text-lg">
                ⭐ Poin Sesi: <span id="poinSesiTampil">0</span>
            </div>
        </div>

        <!-- KARTU WRITING -->
        <div class="bg-white rounded-3xl p-8 shadow-xl border-2 border-blue-100">

            <div class="flex justify-between items-center mb-4 border-b-2 border-blue-100 pb-4">
                <h1 class="text-2xl font-extrabold text-gray-800 flex items-center gap-2">
                    ✍️ Writing <span class="text-blue-500">SMP</span>
                </h1>
                <span id="labelNomorSoal" class="bg-blue-100 text-blue-700 font-bold px-4 py-1 rounded-full text-sm">
                    Soal 1 dari 20
                </span>
            </div>

            <div id="kotakMateri" class="mb-6 text-gray-700 text-sm bg-blue-50 p-4 rounded-xl border border-blue-100 font-medium"></div>

            <div class="bg-gray-50 p-6 rounded-2xl border-2 border-gray-100">
                <div id="teksSoal" class="text-xl font-medium mb-6 leading-relaxed text-center"></div>

                <div id="areaPilihan" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6"></div>

                <button id="tombolKirim" onclick="kirimJawaban()" class="w-full bg-blue-500 text-white px-6 py-3 rounded-xl font-bold text-lg hover:bg-blue-600 shadow-md transition-colors mb-4">
                    🚀 Kirim Jawaban
                </button>

                <div id="pesanHasil" class="hidden mb-6 p-4 rounded-xl border-2 text-center font-bold text-lg"></div>

                <div id="kotakPenjelasanSemua" class="hidden mb-6 p-5 rounded-xl bg-white border-2 border-blue-200 shadow-sm">
                    <h3 class="font-bold text-blue-900 mb-3 text-base">📚 Bedah Fungsi Semua Opsi:</h3>
                    <div id="isiPenjelasanSemua" class="space-y-3 text-sm text-gray-700"></div>
                </div>

                <div class="flex gap-3">
                    <button id="tombolSebelumnya" onclick="soalSebelumnya()" class="hidden flex-1 bg-gray-500 text-white px-6 py-4 rounded-xl font-bold text-lg hover:bg-gray-600 shadow-md transition-colors">
                        ⬅️ Sebelumnya
                    </button>
                    <button id="tombolLanjut" onclick="soalBerikutnya()" class="hidden flex-1 bg-green-500 text-white px-6 py-4 rounded-xl font-bold text-lg hover:bg-green-600 shadow-md transition-colors">
                        ➡️ Lanjut
                    </button>
                </div>

                <button id="tombolSelesai" onclick="simpanPoinDanSelesai()" class="hidden mt-6 w-full bg-green-600 text-white px-6 py-4 rounded-xl font-bold text-xl hover:bg-green-700 shadow-lg">
                    🎉 Selesai & Simpan Poin!
                </button>

                <!-- SKOR AKHIR -->
                <div id="hasilSkor" class="hidden mt-6 p-6 rounded-2xl border-2 border-indigo-200 bg-indigo-50 text-center hasil-box">
                    <div class="text-4xl mb-2">🎉</div>
                    <h2 class="text-2xl font-extrabold text-gray-800 mb-2">Selesai!</h2>
                    <div class="text-3xl font-extrabold text-indigo-600 mb-2">
                        <span id="skorBenar">0</span> dari <span id="skorTotal">0</span>
                        <span id="skorPersen" class="text-lg font-semibold text-gray-500">(0%)</span>
                    </div>
                    <div class="flex justify-center gap-6 text-sm text-gray-600 mb-4">
                        <div>✅ Benar: <span id="benarCount" class="font-bold text-green-600">0</span></div>
                        <div>❌ Salah: <span id="salahCount" class="font-bold text-red-600">0</span></div>
                    </div>
                    <div class="text-sm text-gray-500 mb-4">
                        💡 Poin yang didapat: <span id="skorPoinAkhir" class="font-bold text-indigo-600">0</span>
                    </div>
                    <a href="smp.html" class="inline-block bg-indigo-600 text-white px-6 py-3 rounded-full font-bold hover:bg-indigo-700 transition shadow-md">
                        🏠 Kembali ke Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  20 SOAL GRAMMAR SMP
        // ================================================================
        const daftarSoal = [
            { clue: "💡 Petunjuk: Perhatikan subjek 'She' (tunggal).", depan: "She", belakang: "to school every day.", pilihan: ["go", "goes", "going", "went"], kunci: "goes", penjelasan: { "go": "<b>Go:</b> Untuk I/You/They/We.", "goes": "<b>Goes:</b> She (tunggal) + goes.", "going": "<b>Going:</b> Butuh to be (is going).", "went": "<b>Went:</b> Bentuk lampau." } },
            { clue: "💡 Petunjuk: 'Right now' = sedang berlangsung.", depan: "They", belakang: "a movie right now.", pilihan: ["watch", "watches", "watching", "are watching"], kunci: "are watching", penjelasan: { "watch": "<b>Watch:</b> Simple Present.", "watches": "<b>Watches:</b> Untuk tunggal.", "watching": "<b>Watching:</b> Kurang 'are'.", "are watching": "<b>Are watching:</b> They (jamak) + are + V-ing." } },
            { clue: "💡 Petunjuk: 'Last holiday' = waktu lampau.", depan: "I", belakang: "to Bali last holiday.", pilihan: ["go", "went", "have gone", "will go"], kunci: "went", penjelasan: { "go": "<b>Go:</b> Present.", "went": "<b>Went:</b> Lampau dari 'go'.", "have gone": "<b>Have gone:</b> Present Perfect.", "will go": "<b>Will go:</b> Masa depan." } },
            { clue: "💡 Petunjuk: 'Next year' = masa depan.", depan: "We", belakang: "a new house next year.", pilihan: ["buy", "bought", "will buy", "are buying"], kunci: "will buy", penjelasan: { "buy": "<b>Buy:</b> Present.", "bought": "<b>Bought:</b> Past.", "will buy": "<b>Will buy:</b> Masa depan.", "are buying": "<b>Are buying:</b> Rencana dekat." } },
            { clue: "💡 Petunjuk: Preposisi untuk posisi di atas permukaan.", depan: "The book is", belakang: "the table.", pilihan: ["in", "on", "at", "to"], kunci: "on", penjelasan: { "in": "<b>In:</b> Ruang tertutup.", "on": "<b>On:</b> Di atas permukaan.", "at": "<b>At:</b> Titik spesifik.", "to": "<b>To:</b> Arah tujuan." } },
            { clue: "💡 Petunjuk: 'Three' = lebih dari satu.", depan: "There are three", belakang: "in the basket.", pilihan: ["apple", "apples", "apple's", "appless"], kunci: "apples", penjelasan: { "apple": "<b>Apple:</b> Tunggal.", "apples": "<b>Apples:</b> Jamak.", "apple's": "<b>Apple's:</b> Kepemilikan.", "appless": "<b>Appless:</b> Bukan kata." } },
            { clue: "💡 Petunjuk: 'Before' = pengalaman masa lalu.", depan: "I", belakang: "to that museum before.", pilihan: ["go", "went", "have gone", "have been"], kunci: "have been", penjelasan: { "go": "<b>Go:</b> Present.", "went": "<b>Went:</b> Past, butuh waktu.", "have gone": "<b>Have gone:</b> Masih di sana.", "have been": "<b>Have been:</b> Pengalaman." } },
            { clue: "💡 Petunjuk: Kata untuk memberi saran.", depan: "You", belakang: "bring an umbrella today.", pilihan: ["must", "can", "should", "might"], kunci: "should", penjelasan: { "must": "<b>Must:</b> Keharusan.", "can": "<b>Can:</b> Kemampuan.", "should": "<b>Should:</b> Saran.", "might": "<b>Might:</b> Kemungkinan." } },
            { clue: "💡 Petunjuk: 'Engineer' diawali bunyi vokal.", depan: "She wants to be", belakang: "engineer.", pilihan: ["a", "an", "the", "none"], kunci: "an", penjelasan: { "a": "<b>A:</b> Konsonan.", "an": "<b>An:</b> Bunyi vokal.", "the": "<b>The:</b> Spesifik.", "none": "<b>None:</b> Butuh artikel." } },
            { clue: "💡 Petunjuk: Kata tanya untuk subjek 'you'.", depan: "", belakang: "you like to dance?", pilihan: ["Are", "Do", "Does", "Is"], kunci: "Do", penjelasan: { "Are": "<b>Are:</b> To be.", "Do": "<b>Do:</b> You + Do.", "Does": "<b>Does:</b> Tunggal.", "Is": "<b>Is:</b> To be." } },
            { clue: "💡 Petunjuk: 'I' memakai to be khusus.", depan: "I", belakang: "a dedicated student.", pilihan: ["am", "is", "are", "be"], kunci: "am", penjelasan: { "am": "<b>Am:</b> I + am.", "is": "<b>Is:</b> He/She/It.", "are": "<b>Are:</b> You/They/We.", "be": "<b>Be:</b> Bentuk dasar." } },
            { clue: "💡 Petunjuk: Tanya untuk aksi sedang berlangsung.", depan: "", belakang: "she reading a book now?", pilihan: ["Is", "Are", "Do", "Does"], kunci: "Is", penjelasan: { "Is": "<b>Is:</b> She + Is.", "Are": "<b>Are:</b> Jamak.", "Do": "<b>Do:</b> Simple Present.", "Does": "<b>Does:</b> Simple Present." } },
            { clue: "💡 Petunjuk: 'This morning' = waktu lampau.", depan: "She", belakang: "an apple this morning.", pilihan: ["eat", "ate", "eaten", "eats"], kunci: "ate", penjelasan: { "eat": "<b>Eat:</b> Present.", "ate": "<b>Ate:</b> Lampau dari eat.", "eaten": "<b>Eaten:</b> V3 (butuh has/have).", "eats": "<b>Eats:</b> Present tunggal." } },
            { clue: "💡 Petunjuk: 'Next week' = rencana pasti.", depan: "We", belakang: "visit grandma next week.", pilihan: ["go", "went", "will go", "are going to"], kunci: "are going to", penjelasan: { "go": "<b>Go:</b> Present.", "went": "<b>Went:</b> Past.", "will go": "<b>Will go:</b> Bisa.", "are going to": "<b>Are going to:</b> Rencana matang." } },
            { clue: "💡 Petunjuk: 'Milk' tidak bisa dihitung.", depan: "There isn't", belakang: "milk in the fridge.", pilihan: ["many", "much", "few", "a lot"], kunci: "much", penjelasan: { "many": "<b>Many:</b> Countable.", "much": "<b>Much:</b> Uncountable.", "few": "<b>Few:</b> Countable.", "a lot": "<b>A lot:</b> Positif." } },
            { clue: "💡 Petunjuk: Dua kejadian di masa lalu.", depan: "She", belakang: "dinner when I arrived.", pilihan: ["cook", "cooked", "was cooking", "has cooked"], kunci: "was cooking", penjelasan: { "cook": "<b>Cook:</b> Present.", "cooked": "<b>Cooked:</b> Simple Past.", "was cooking": "<b>Was cooking:</b> Sedang berlangsung.", "has cooked": "<b>Has cooked:</b> Present Perfect." } },
            { clue: "💡 Petunjuk: Kata untuk kemampuan.", depan: "I", belakang: "speak three languages.", pilihan: ["can", "may", "must", "should"], kunci: "can", penjelasan: { "can": "<b>Can:</b> Kemampuan.", "may": "<b>May:</b> Izin.", "must": "<b>Must:</b> Keharusan.", "should": "<b>Should:</b> Saran." } },
            { clue: "💡 Petunjuk: Kata ganti kepemilikan tanpa kata benda.", depan: "This bag is", belakang: ", not yours.", pilihan: ["my", "mine", "me", "I"], kunci: "mine", penjelasan: { "my": "<b>My:</b> Diikuti kata benda.", "mine": "<b>Mine:</b> Berdiri sendiri.", "me": "<b>Me:</b> Object pronoun.", "I": "<b>I:</b> Subject pronoun." } },
            { clue: "💡 Petunjuk: Kata untuk alasan (sebab).", depan: "She was happy", belakang: "she got a gift.", pilihan: ["because", "so", "but", "although"], kunci: "because", penjelasan: { "because": "<b>Because:</b> Alasan.", "so": "<b>So:</b> Akibat.", "but": "<b>But:</b> Pertentangan.", "although": "<b>Although:</b> Meskipun." } },
            { clue: "💡 Petunjuk: Kata untuk kalimat negatif.", depan: "There isn't", belakang: "sugar in the jar.", pilihan: ["some", "any", "many", "much"], kunci: "any", penjelasan: { "some": "<b>Some:</b> Positif.", "any": "<b>Any:</b> Negatif.", "many": "<b>Many:</b> Countable.", "much": "<b>Much:</b> Uncountable." } }
        ];

        // ================================================================
        //  STATE & LOGIC
        // ================================================================
        let indeksSoalAktif = 0;
        let poinSesi = 0;
        let pilihanDipilih = null;
        let statusRiwayat = {};

        function muatSoal() {
            let soal = daftarSoal[indeksSoalAktif];
            document.getElementById("labelNomorSoal").innerHTML = "Soal " + (indeksSoalAktif + 1) + " dari " + daftarSoal.length;
            document.getElementById("kotakMateri").innerHTML = soal.clue || "";
            let depan = soal.depan ? soal.depan + " " : "";
            document.getElementById("teksSoal").innerHTML = '"' + depan + '<span class="text-blue-600 font-bold underline bg-blue-100 px-2 py-1 rounded">[ ... ]</span> ' + soal.belakang + '"';

            let areaPilihan = document.getElementById("areaPilihan");
            areaPilihan.innerHTML = "";
            pilihanDipilih = null;

            soal.pilihan.forEach(function(opsi) {
                let tombol = document.createElement("button");
                tombol.innerHTML = opsi;
                tombol.id = "opsi-" + opsi;
                tombol.className = "option-btn";
                tombol.onclick = function() { pilihOpsi(opsi); };
                areaPilihan.appendChild(tombol);
            });

            if (indeksSoalAktif > 0) {
                document.getElementById("tombolSebelumnya").classList.remove("hidden");
            } else {
                document.getElementById("tombolSebelumnya").classList.add("hidden");
            }

            let riwayat = statusRiwayat[indeksSoalAktif];
            if (riwayat && riwayat.sudahBenar) {
                pilihanDipilih = riwayat.pilihan;
                tandaiTombolTerpilih(pilihanDipilih);
                tampilkanHasilDanBedah(true, true);
            } else {
                document.getElementById("pesanHasil").classList.add("hidden");
                document.getElementById("kotakPenjelasanSemua").classList.add("hidden");
                document.getElementById("tombolLanjut").classList.add("hidden");
                document.getElementById("tombolKirim").classList.remove("hidden");
                document.getElementById("tombolSelesai").classList.add("hidden");
                document.querySelectorAll(".option-btn").forEach(b => {
                    b.classList.remove("selected", "correct", "wrong", "disabled");
                });
            }
        }

        function pilihOpsi(opsi) {
            let riwayat = statusRiwayat[indeksSoalAktif];
            if (riwayat && riwayat.sudahBenar) return;
            pilihanDipilih = opsi;
            tandaiTombolTerpilih(opsi);
        }

        function tandaiTombolTerpilih(opsiTerpilih) {
            document.querySelectorAll(".option-btn").forEach(function(btn) {
                btn.classList.remove("selected");
                if (btn.innerHTML === opsiTerpilih) {
                    btn.classList.add("selected");
                }
            });
        }

        function kirimJawaban() {
            if (!pilihanDipilih) {
                alert("Kak, pilih dulu jawabannya ya!");
                return;
            }

            let soalAktif = daftarSoal[indeksSoalAktif];
            let isBenar = (pilihanDipilih === soalAktif.kunci);

            if (isBenar) {
                if (!statusRiwayat[indeksSoalAktif] || !statusRiwayat[indeksSoalAktif].sudahBenar) {
                    poinSesi += 10;
                    document.getElementById("poinSesiTampil").innerHTML = poinSesi;
                }
                statusRiwayat[indeksSoalAktif] = { sudahBenar: true, pilihan: pilihanDipilih };
            } else {
                statusRiwayat[indeksSoalAktif] = { sudahBenar: false, pilihan: pilihanDipilih };
            }

            tampilkanHasilDanBedah(isBenar, false);

            // LANGSUNG MUNCULKAN TOMBOL LANJUT (meskipun salah)
            document.getElementById("tombolKirim").classList.add("hidden");
            if (indeksSoalAktif < daftarSoal.length - 1) {
                document.getElementById("tombolLanjut").classList.remove("hidden");
            } else {
                document.getElementById("tombolSelesai").classList.remove("hidden");
            }
        }

        function tampilkanHasilDanBedah(isBenar, dariReview) {
            let soalAktif = daftarSoal[indeksSoalAktif];
            let pesan = document.getElementById("pesanHasil");
            pesan.classList.remove("hidden");

            let kotakPenjelasan = document.getElementById("kotakPenjelasanSemua");
            let isiPenjelasan = document.getElementById("isiPenjelasanSemua");
            kotakPenjelasan.classList.remove("hidden");

            let htmlSemua = "";
            for (let key in soalAktif.penjelasan) {
                let statusWarna = "text-gray-600 bg-gray-50 p-2 rounded";
                if (isBenar && key === soalAktif.kunci) {
                    statusWarna = "text-green-700 font-bold bg-green-50 p-2 rounded border border-green-200";
                }
                htmlSemua += '<div class="' + statusWarna + '">• ' + soalAktif.penjelasan[key] + '</div>';
            }
            isiPenjelasan.innerHTML = htmlSemua;

            // Tandai tombol
            document.querySelectorAll(".option-btn").forEach(function(btn) {
                btn.classList.add("disabled");
                if (btn.innerHTML === soalAktif.kunci) {
                    btn.classList.add("correct");
                } else if (btn.innerHTML === pilihanDipilih && !isBenar) {
                    btn.classList.add("wrong");
                }
            });

            if (isBenar) {
                pesan.innerHTML = dariReview ?
                    '📚 <b>Mode Review:</b> Soal ini sudah kamu jawab dengan benar sebelumnya.' :
                    '🎉 <b>Tepat sekali! Pilihanmu benar.</b> (+10 Poin)';
                pesan.className = "mb-4 p-4 rounded-xl border-2 bg-green-50 text-green-800 border-green-200 text-base";
            } else {
                pesan.innerHTML = '⚠️ <b>Kurang tepat.</b> Cek penjelasan di bawah untuk belajar!';
                pesan.className = "mb-4 p-4 rounded-xl border-2 bg-red-50 text-red-800 border-red-200 text-base";
            }
        }

        function soalBerikutnya() {
            indeksSoalAktif++;
            muatSoal();
        }

        function soalSebelumnya() {
            if (indeksSoalAktif > 0) {
                indeksSoalAktif--;
                muatSoal();
            }
        }

        function simpanPoinDanSelesai() {
            // ===== HITUNG SKOR =====
            let totalSoal = daftarSoal.length;
            let benar = 0;
            for (let i = 0; i < totalSoal; i++) {
                if (statusRiwayat[i] && statusRiwayat[i].sudahBenar) {
                    benar++;
                }
            }
            let salah = totalSoal - benar;

            // ===== TAMPILKAN SKOR =====
            document.getElementById("hasilSkor").classList.remove("hidden");
            document.getElementById("skorBenar").innerHTML = benar;
            document.getElementById("skorTotal").innerHTML = totalSoal;
            document.getElementById("benarCount").innerHTML = benar;
            document.getElementById("salahCount").innerHTML = salah;
            document.getElementById("skorPoinAkhir").innerHTML = poinSesi;
            let persen = Math.round((benar / totalSoal) * 100);
            document.getElementById("skorPersen").innerHTML = "(" + persen + "%)";

            // ===== SEMBUNYIKAN TOMBOL SELESAI =====
            document.getElementById("tombolSelesai").classList.add("hidden");

            // ===== SIMPAN POIN =====
            let poinTotalLama = parseInt(localStorage.getItem('poinMurid')) || 0;
            localStorage.setItem('poinMurid', poinTotalLama + poinSesi);
        }

        // ================================================================
        //  INISIALISASI
        // ================================================================
        muatSoal();
    </script>
</body>
</html>
