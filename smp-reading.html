<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading SMP | ENG-LEARN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { min-height: 100vh; padding: 1.5rem; background-color: #fce4ec; }
        .max-w-3xl { max-width: 48rem; margin-left: auto; margin-right: auto; }
        /* Mobile fix */
        @media (max-width: 640px) {
            #areaPilihan { grid-template-columns: 1fr 1fr !important; gap: 12px !important; }
            #areaPilihan button { padding: 16px 8px !important; font-size: 0.9rem !important; min-height: 52px !important; }
            .flex.gap-3 { flex-direction: column !important; gap: 12px !important; }
            #tombolSebelumnya, #tombolLanjut { width: 100% !important; min-height: 52px !important; }
            #tombolKirim, #tombolLanjut, #tombolSelesai { padding: 16px !important; font-size: 1rem !important; min-height: 56px !important; }
            .max-w-3xl.mx-auto.mb-6.flex.justify-between { flex-wrap: wrap !important; gap: 12px !important; }
            .bg-white.rounded-3xl { padding: 16px !important; }
            #teksSoal { font-size: 1rem !important; }
            #kotakMateri { font-size: 0.9rem !important; padding: 12px !important; }
        }
        button:active { transform: scale(0.96); transition: transform 0.1s ease; }
        #areaPilihan button.bg-rose-500, #areaPilihan button.bg-rose-500:active { color: white !important; }
        .option-btn { transition: all 0.2s ease; border: 2px solid #e5e7eb; background: white; padding: 16px 12px; border-radius: 16px; font-weight: 600; font-size: 1rem; min-height: 56px; cursor: pointer; }
        .option-btn:hover { border-color: #f43f5e; background: #ffe4e6; }
        .option-btn.correct { border-color: #22c55e; background: #dcfce7; }
        .option-btn.wrong { border-color: #ef4444; background: #fee2e2; }
        .option-btn.disabled { pointer-events: none; opacity: 0.7; }
        .option-btn.selected { border-color: #f43f5e; background: #fecdd3; }
    </style>
</head>
<body>

    <div class="max-w-3xl mx-auto mb-6 flex justify-between items-center">
        <a href="smp.html" onclick="return confirm('Yakin mau kembali? Poin sesi ini akan hangus lho!')" class="inline-flex items-center text-red-500 hover:text-red-700 font-bold bg-white px-4 py-2 rounded-xl shadow-sm border border-red-100 transition-all">
            ⬅️ Batal & Kembali
        </a>
        <div class="bg-rose-500 text-white font-bold px-6 py-2 rounded-xl shadow-md flex items-center gap-2 text-lg">
            ⭐ Poin Sesi: <span id="poinSesiTampil">0</span>
        </div>
    </div>

    <div class="max-w-3xl mx-auto bg-white rounded-3xl p-8 shadow-xl border-2 border-rose-50">
        <div class="flex justify-between items-center mb-4 border-b-2 border-rose-100 pb-4">
            <h1 class="text-2xl font-bold text-gray-800">📖 Reading Comprehension (SMP)</h1>
            <span id="labelNomorSoal" class="bg-rose-100 text-rose-700 font-bold px-4 py-1 rounded-full text-sm">Soal 1 dari 10</span>
        </div>

        <!-- Teks bacaan -->
        <div id="kotakMateri" class="mb-6 text-gray-700 text-base bg-rose-50 p-4 rounded-xl border border-rose-100 font-medium"></div>

        <div class="bg-gray-50 p-6 rounded-2xl border-2 border-gray-100">
            <div id="teksSoal" class="text-xl font-medium mb-6 leading-relaxed text-center"></div>

            <div id="areaPilihan" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6"></div>

            <button id="tombolKirim" onclick="kirimJawaban()" class="w-full bg-rose-500 text-white px-6 py-3 rounded-xl font-bold text-lg hover:bg-rose-600 shadow-md transition-colors mb-4">
                🚀 Kirim Jawaban
            </button>

            <div id="pesanHasil" class="hidden mb-6 p-4 rounded-xl border-2"></div>

            <div id="kotakPenjelasanSemua" class="hidden mb-6 p-5 rounded-xl bg-white border-2 border-rose-200 shadow-sm">
                <h3 class="font-bold text-rose-900 mb-3 text-base">📚 Bedah Fungsi Semua Opsi:</h3>
                <div id="isiPenjelasanSemua" class="space-y-3 text-sm text-gray-700"></div>
            </div>

            <div class="flex gap-3">
                <button id="tombolSebelumnya" onclick="soalSebelumnya()" class="hidden flex-1 bg-gray-500 text-white px-6 py-4 rounded-xl font-bold text-lg hover:bg-gray-600 shadow-md transition-colors">
                    ⬅️ Sebelumnya
                </button>
                <button id="tombolLanjut" onclick="soalBerikutnya()" class="hidden flex-1 bg-green-500 text-white px-6 py-4 rounded-xl font-bold text-lg hover:bg-green-600 shadow-md transition-colors">
                    ➡️ Lanjut
                </button>
            </div>

            <button id="tombolSelesai" onclick="simpanPoinDanSelesai()" class="hidden mt-6 w-full bg-green-600 text-white px-6 py-4 rounded-xl font-bold text-xl hover:bg-green-700 shadow-lg">
                🎉 Selesai & Simpan Poin!
            </button>
        </div>
    </div>

    <script>
        const daftarSoal = [{
            // Soal 1 (SMP)
            reading: "My name is Rina. I have a cat named Mochi. Mochi is an orange cat. She likes to sleep on the sofa. Every morning, I give her milk. She is very cute and playful.",
            clue: "Bacaan tentang kucing Rina.",
            depan: "What is the name of Rina's cat?",
            pilihan: ["Mochi", "Milo", "Mimi", "Momo"],
            kunci: "Mochi",
            penjelasan: {
                "Mochi": "<b>Mochi:</b> BENAR! Di teks tertulis: 'I have a cat named Mochi.'",
                "Milo": "<b>Milo:</b> Salah. Nama kucing Rina adalah Mochi, bukan Milo.",
                "Mimi": "<b>Mimi:</b> Salah. Nama kucing Rina adalah Mochi, bukan Mimi.",
                "Momo": "<b>Momo:</b> Salah. Nama kucing Rina adalah Mochi, bukan Momo."
            }
        }, {
            // Soal 2
            reading: "My name is Rina. I have a cat named Mochi. Mochi is an orange cat. She likes to sleep on the sofa. Every morning, I give her milk. She is very cute and playful.",
            clue: "Bacaan tentang kucing Rina.",
            depan: "What color is Mochi?",
            pilihan: ["Black", "White", "Orange", "Gray"],
            kunci: "Orange",
            penjelasan: {
                "Black": "<b>Black:</b> Salah. Mochi berwarna oranye, bukan hitam.",
                "White": "<b>White:</b> Salah. Mochi berwarna oranye, bukan putih.",
                "Orange": "<b>Orange:</b> BENAR! Di teks: 'Mochi is an orange cat.'",
                "Gray": "<b>Gray:</b> Salah. Mochi berwarna oranye, bukan abu-abu."
            }
        }, {
            // Soal 3
            reading: "My name is Rina. I have a cat named Mochi. Mochi is an orange cat. She likes to sleep on the sofa. Every morning, I give her milk. She is very cute and playful.",
            clue: "Bacaan tentang kucing Rina.",
            depan: "Where does Mochi like to sleep?",
            pilihan: ["On the bed", "On the sofa", "On the floor", "On the chair"],
            kunci: "On the sofa",
            penjelasan: {
                "On the bed": "<b>On the bed:</b> Salah. Mochi suka tidur di sofa, bukan di tempat tidur.",
                "On the sofa": "<b>On the sofa:</b> BENAR! Di teks: 'She likes to sleep on the sofa.'",
                "On the floor": "<b>On the floor:</b> Salah. Mochi suka tidur di sofa, bukan di lantai.",
                "On the chair": "<b>On the chair:</b> Salah. Mochi suka tidur di sofa, bukan di kursi."
            }
        }, {
            // Soal 4
            reading: "My name is Rina. I have a cat named Mochi. Mochi is an orange cat. She likes to sleep on the sofa. Every morning, I give her milk. She is very cute and playful.",
            clue: "Bacaan tentang kucing Rina.",
            depan: "What does Rina give Mochi every morning?",
            pilihan: ["Fish", "Milk", "Meat", "Bread"],
            kunci: "Milk",
            penjelasan: {
                "Fish": "<b>Fish:</b> Salah. Rina memberi Mochi susu, bukan ikan.",
                "Milk": "<b>Milk:</b> BENAR! Di teks: 'Every morning, I give her milk.'",
                "Meat": "<b>Meat:</b> Salah. Rina memberi Mochi susu, bukan daging.",
                "Bread": "<b>Bread:</b> Salah. Rina memberi Mochi susu, bukan roti."
            }
        }, {
            // Soal 5
            reading: "My name is Rina. I have a cat named Mochi. Mochi is an orange cat. She likes to sleep on the sofa. Every morning, I give her milk. She is very cute and playful.",
            clue: "Bacaan tentang kucing Rina.",
            depan: "How does Rina describe Mochi?",
            pilihan: ["Cute and playful", "Big and strong", "Fast and smart", "Quiet and shy"],
            kunci: "Cute and playful",
            penjelasan: {
                "Cute and playful": "<b>Cute and playful:</b> BENAR! Di teks: 'She is very cute and playful.'",
                "Big and strong": "<b>Big and strong:</b> Salah. Mochi digambarkan imut dan suka bermain.",
                "Fast and smart": "<b>Fast and smart:</b> Salah. Mochi digambarkan imut dan suka bermain.",
                "Quiet and shy": "<b>Quiet and shy:</b> Salah. Mochi digambarkan imut dan suka bermain."
            }
        }, {
            // Soal 6
            reading: "My name is Rina. I have a cat named Mochi. Mochi is an orange cat. She likes to sleep on the sofa. Every morning, I give her milk. She is very cute and playful.",
            clue: "Bacaan tentang kucing Rina.",
            depan: "What is the main idea of the text?",
            pilihan: ["Rina likes milk.", "Mochi is a cute cat.", "Rina has a cat named Mochi.", "Sofas are comfortable."],
            kunci: "Rina has a cat named Mochi.",
            penjelasan: {
                "Rina likes milk.": "<b>Rina likes milk:</b> Salah. Ini bukan ide utama.",
                "Mochi is a cute cat.": "<b>Mochi is a cute cat:</b> Kurang tepat. Ini hanya detail.",
                "Rina has a cat named Mochi.": "<b>Rina has a cat named Mochi.:</b> BENAR! Ini adalah ide utama dari teks.",
                "Sofas are comfortable.": "<b>Sofas are comfortable:</b> Salah. Ini tidak relevan."
            }
        }, {
            // Soal 7
            reading: "My name is Rina. I have a cat named Mochi. Mochi is an orange cat. She likes to sleep on the sofa. Every morning, I give her milk. She is very cute and playful.",
            clue: "Bacaan tentang kucing Rina.",
            depan: "What does 'playful' mean?",
            pilihan: ["Lazy", "Active and fun", "Quiet", "Sleepy"],
            kunci: "Active and fun",
            penjelasan: {
                "Lazy": "<b>Lazy:</b> Salah. Playful berarti aktif dan suka bermain.",
                "Active and fun": "<b>Active and fun:</b> BENAR! Playful berarti aktif dan menyenangkan.",
                "Quiet": "<b>Quiet:</b> Salah. Playful berarti aktif dan suka bermain.",
                "Sleepy": "<b>Sleepy:</b> Salah. Playful berarti aktif dan suka bermain."
            }
        }, {
            // Soal 8
            reading: "My name is Rina. I have a cat named Mochi. Mochi is an orange cat. She likes to sleep on the sofa. Every morning, I give her milk. She is very cute and playful.",
            clue: "Bacaan tentang kucing Rina.",
            depan: "Who is telling the story?",
            pilihan: ["Mochi", "Rina's friend", "Rina", "Rina's mother"],
            kunci: "Rina",
            penjelasan: {
                "Mochi": "<b>Mochi:</b> Salah. Kucing tidak bercerita.",
                "Rina's friend": "<b>Rina's friend:</b> Salah. Tokoh 'Aku' adalah Rina.",
                "Rina": "<b>Rina:</b> BENAR! Teks menggunakan sudut pandang orang pertama (my).",
                "Rina's mother": "<b>Rina's mother:</b> Salah. Tokoh 'Aku' adalah Rina."
            }
        }, {
            // Soal 9
            reading: "My name is Rina. I have a cat named Mochi. Mochi is an orange cat. She likes to sleep on the sofa. Every morning, I give her milk. She is very cute and playful.",
            clue: "Bacaan tentang kucing Rina.",
            depan: "What does Rina do every morning?",
            pilihan: ["She plays with Mochi.", "She gives Mochi milk.", "She sleeps on the sofa.", "She takes Mochi for a walk."],
            kunci: "She gives Mochi milk.",
            penjelasan: {
                "She plays with Mochi.": "<b>She plays with Mochi:</b> Salah. Rina memberi susu setiap pagi.",
                "She gives Mochi milk.": "<b>She gives Mochi milk.:</b> BENAR! Di teks: 'Every morning, I give her milk.'",
                "She sleeps on the sofa.": "<b>She sleeps on the sofa:</b> Salah. Mochi yang tidur di sofa.",
                "She takes Mochi for a walk.": "<b>She takes Mochi for a walk:</b> Salah. Rina tidak mengajak jalan."
            }
        }, {
            // Soal 10
            reading: "My name is Rina. I have a cat named Mochi. Mochi is an orange cat. She likes to sleep on the sofa. Every morning, I give her milk. She is very cute and playful.",
            clue: "Bacaan tentang kucing Rina.",
            depan: "What is the best title for this text?",
            pilihan: ["My Cat Mochi", "My Morning Routine", "Rina's Family", "Cute Animals"],
            kunci: "My Cat Mochi",
            penjelasan: {
                "My Cat Mochi": "<b>My Cat Mochi:</b> BENAR! Teks menceritakan tentang kucing Rina.",
                "My Morning Routine": "<b>My Morning Routine:</b> Kurang tepat. Hanya sebagian kecil.",
                "Rina's Family": "<b>Rina's Family:</b> Salah. Tidak membahas keluarga.",
                "Cute Animals": "<b>Cute Animals:</b> Terlalu umum, spesifik tentang Mochi."
            }
        }];

        let indeksSoalAktif = 0;
        let poinSesi = 0;
        let pilihanDipilih = null;
        let statusRiwayat = {};

        function muatSoal() {
            let soal = daftarSoal[indeksSoalAktif];
            document.getElementById("labelNomorSoal").innerHTML = "Soal " + (indeksSoalAktif + 1) + " dari 10";
            document.getElementById("kotakMateri").innerHTML = soal.reading + "<br><br><span class='text-rose-500 font-semibold'>💡 Petunjuk: " + soal.clue + "</span>";
            document.getElementById("teksSoal").innerHTML = soal.depan;

            let areaPilihan = document.getElementById("areaPilihan");
            areaPilihan.innerHTML = "";
            pilihanDipilih = null;

            soal.pilihan.forEach(function(opsi) {
                let tombol = document.createElement("button");
                tombol.innerHTML = opsi;
                tombol.id = "opsi-" + opsi;
                tombol.className = "option-btn";
                tombol.onclick = function() { pilihOpsi(opsi); };
                areaPilihan.appendChild(tombol);
            });

            if (indeksSoalAktif > 0) {
                document.getElementById("tombolSebelumnya").classList.remove("hidden");
            } else {
                document.getElementById("tombolSebelumnya").classList.add("hidden");
            }

            let riwayat = statusRiwayat[indeksSoalAktif];
            if (riwayat && riwayat.sudahBenar) {
                pilihanDipilih = riwayat.pilihan;
                tandaiTombolTerpilih(pilihanDipilih);
                tampilkanHasilDanBedah(true, true);
            } else {
                document.getElementById("pesanHasil").classList.add("hidden");
                document.getElementById("kotakPenjelasanSemua").classList.add("hidden");
                document.getElementById("tombolLanjut").classList.add("hidden");
                document.getElementById("tombolKirim").classList.remove("hidden");
                document.getElementById("tombolSelesai").classList.add("hidden");
            }
        }

        function pilihOpsi(opsi) {
            let riwayat = statusRiwayat[indeksSoalAktif];
            if (riwayat && riwayat.sudahBenar) return;
            pilihanDipilih = opsi;
            tandaiTombolTerpilih(opsi);
        }

        function tandaiTombolTerpilih(opsiTerpilih) {
            let soal = daftarSoal[indeksSoalAktif];
            soal.pilihan.forEach(function(o) {
                let btn = document.getElementById("opsi-" + o);
                if (btn) {
                    if (o === opsiTerpilih) {
                        btn.className = "option-btn bg-rose-500 border-2 border-rose-600 text-white font-bold";
                    } else {
                        btn.className = "option-btn";
                    }
                }
            });
        }

        function kirimJawaban() {
            if (!pilihanDipilih) {
                alert("Pilih salah satu opsi jawaban terlebih dahulu ya mase!");
                return;
            }
            let soalAktif = daftarSoal[indeksSoalAktif];
            let isBenar = (pilihanDipilih === soalAktif.kunci);
            if (isBenar) {
                if (!statusRiwayat[indeksSoalAktif] || !statusRiwayat[indeksSoalAktif].sudahBenar) {
                    poinSesi += 10;
                    document.getElementById("poinSesiTampil").innerHTML = poinSesi;
                }
                statusRiwayat[indeksSoalAktif] = { sudahBenar: true, pilihan: pilihanDipilih };
                tampilkanHasilDanBedah(true, false);
            } else {
                statusRiwayat[indeksSoalAktif] = { sudahBenar: false, pilihan: pilihanDipilih };
                tampilkanHasilDanBedah(false, false);
            }
        }

        function tampilkanHasilDanBedah(isBenar, dariReview) {
            let soalAktif = daftarSoal[indeksSoalAktif];
            let pesan = document.getElementById("pesanHasil");
            pesan.classList.remove("hidden");
            let kotakPenjelasan = document.getElementById("kotakPenjelasanSemua");
            let isiPenjelasan = document.getElementById("isiPenjelasanSemua");
            kotakPenjelasan.classList.remove("hidden");
            let htmlSemua = "";
            for (let key in soalAktif.penjelasan) {
                let statusWarna = "text-gray-600 bg-gray-50 p-2 rounded";
                if (isBenar && key === soalAktif.kunci) {
                    statusWarna = "text-green-700 font-bold bg-green-50 p-2 rounded border border-green-200";
                }
                htmlSemua += '<div class="' + statusWarna + '">• ' + soalAktif.penjelasan[key] + '</div>';
            }
            isiPenjelasan.innerHTML = htmlSemua;
            if (isBenar) {
                pesan.innerHTML = dariReview ?
                    '📚 <b>Mode Review:</b> Soal ini sudah kamu jawab dengan benar sebelumnya.' :
                    '🎉 <b>Tepat sekali! Pilihanmu benar.</b>';
                pesan.className = "mb-4 p-4 rounded-xl border-2 bg-green-50 text-green-800 border-green-200 text-base";
                document.getElementById("tombolKirim").classList.add("hidden");
                if (indeksSoalAktif < daftarSoal.length - 1) {
                    document.getElementById("tombolLanjut").classList.remove("hidden");
                } else {
                    document.getElementById("tombolSelesai").classList.remove("hidden");
                }
            } else {
                pesan.innerHTML = '⚠️ <b>Kurang tepat.</b> Jawabannya belum benar, yuk cek fungsi masing-masing opsi di bawah!';
                pesan.className = "mb-4 p-4 rounded-xl border-2 bg-red-50 text-red-800 border-red-200 text-base";
                document.getElementById("tombolLanjut").classList.add("hidden");
                document.getElementById("tombolSelesai").classList.add("hidden");
            }
        }

        function soalBerikutnya() {
            indeksSoalAktif++;
            muatSoal();
        }

        function soalSebelumnya() {
            if (indeksSoalAktif > 0) {
                indeksSoalAktif--;
                muatSoal();
            }
        }

        function simpanPoinDanSelesai() {
            let poinTotalLama = parseInt(localStorage.getItem('poinMurid')) || 0;
            localStorage.setItem('poinMurid', poinTotalLama + poinSesi);
            window.location.href = "smp.html";
        }

        muatSoal();
    </script>
</body>
</html>
