<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Petualangan Inggris - Intermediate | ENG-LEARN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { min-height: 100vh; padding: 1rem; background: linear-gradient(135deg, #fef3c7, #fcd34d); }
        .max-w-3xl { max-width: 42rem; margin: 0 auto; }
        .mascot { font-size: 4rem; animation: bounce 2s infinite; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .progress-track { background: #e5e7eb; border-radius: 20px; height: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f59e0b, #d97706); border-radius: 20px; transition: width 0.5s ease; width: 0%; }
        .option-btn { transition: all 0.2s ease; border: 3px solid #e5e7eb; background: white; padding: 16px 12px; border-radius: 16px; font-weight: 700; font-size: 1.1rem; min-height: 56px; cursor: pointer; text-align: center; color: #1f2937; }
        .option-btn:hover { border-color: #f59e0b; background: #fffbeb; transform: scale(1.02); }
        .option-btn.correct { border-color: #22c55e; background: #dcfce7; }
        .option-btn.wrong { border-color: #ef4444; background: #fee2e2; }
        .option-btn.disabled { pointer-events: none; opacity: 0.7; }
        .option-btn.selected { border-color: #f59e0b; background: #fef3c7; }
        .btn-audio { background: #22c55e; transition: all 0.3s ease; padding: 14px 28px; border-radius: 60px; font-weight: 700; font-size: 1.1rem; color: white; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(34,197,94,0.4); }
        .btn-audio:hover { background: #16a34a; transform: scale(1.05); }
        .soal-card { background: white; border-radius: 30px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.08); border: 3px solid #fbbf24; }
        .badge-level { display: inline-block; background: #f59e0b; color: white; font-size: 0.7rem; font-weight: 700; padding: 4px 16px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        .sticker { font-size: 3.5rem; display: inline-block; animation: pop 0.5s ease-out; }
        @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
        .gambar-soal { text-align: center; margin-bottom: 12px; border-radius: 16px; overflow: hidden; background: #f3f4f6; max-height: 50vh; display: flex; align-items: center; justify-content: center; }
        .gambar-soal img { width: 100%; height: 100%; max-height: 50vh; object-fit: cover; }
        @media (max-width: 640px) {
            .soal-card { padding: 16px !important; }
            .option-btn { font-size: 0.95rem !important; padding: 14px 10px !important; min-height: 48px !important; }
            #teksSoal { font-size: 1.1rem !important; }
            .mascot { font-size: 3rem !important; }
            .btn-audio { font-size: 0.95rem !important; padding: 12px 20px !important; }
            #teksBacaan { font-size: 0.9rem !important; padding: 12px !important; }
            .gambar-soal { max-height: 35vh !important; }
            .gambar-soal img { max-height: 35vh !important; }
        }
        button:active { transform: scale(0.96); }
        .btn-back { background: white; border-radius: 12px; padding: 8px 16px; font-weight: 600; color: #d97706; border: 2px solid #fde68a; transition: all 0.2s; }
        .btn-back:hover { background: #fffbeb; }
        .hasil-box { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <div class="max-w-3xl mx-auto">

        <div class="mb-4 flex flex-wrap justify-between items-center gap-3">
            <a href="sd.html" onclick="return confirm('Kak, yakin mau kembali? Poin sesi ini akan hangus lho!')" class="btn-back inline-flex items-center gap-1">
                ⬅️ Kembali
            </a>
            <div class="bg-yellow-500 text-white font-bold px-6 py-2 rounded-xl shadow-md flex items-center gap-2 text-lg">
                ⭐ Poin: <span id="poinTotal">0</span>
            </div>
        </div>

        <div class="soal-card">

            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-3">
                    <span class="badge-level">🌟 Intermediate</span>
                    <span class="text-sm font-semibold text-gray-500">Petualangan</span>
                </div>
                <span id="labelNomorSoal" class="bg-yellow-100 text-yellow-700 font-bold px-4 py-1 rounded-full text-sm">
                    Soal 1 dari 12
                </span>
            </div>

            <div class="flex items-center gap-4 mb-4 bg-yellow-50 rounded-2xl p-4 border-2 border-yellow-200">
                <div class="mascot">🦊</div>
                <div>
                    <div class="font-bold text-gray-700 text-sm">Halo, Petualang!</div>
                    <div id="pesanMaskot" class="text-sm text-gray-600">Ayo jawab 12 soal ini dengan benar!</div>
                </div>
            </div>

            <div class="mb-5">
                <div class="flex justify-between text-xs text-gray-500 mb-1">
                    <span>Progress</span>
                    <span id="progressLabel">0%</span>
                </div>
                <div class="progress-track">
                    <div id="progressFill" class="progress-fill" style="width: 0%;"></div>
                </div>
            </div>

            <div id="areaSoal">

                <div id="tipeSoalBadge" class="mb-3">
                    <span class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full">📝 Vocabulary</span>
                </div>

                <div id="gambarSoal" class="gambar-soal">
                    <img id="gambarImg" src="" alt="Gambar soal" />
                </div>

                <div id="teksBacaan" class="hidden bg-gray-50 p-4 rounded-xl border-l-4 border-purple-400 mb-4 text-sm leading-relaxed">
                    Teks bacaan...
                </div>

                <div id="teksSoal" class="text-xl font-bold text-gray-800 mb-5 leading-relaxed">
                    Pertanyaan...
                </div>

                <div id="areaAudio" class="hidden text-center mb-4">
                    <button onclick="putarAudio()" class="btn-audio inline-flex items-center gap-2">
                        🔊 Dengarkan
                    </button>
                </div>

                <div id="areaPilihan" class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-5"></div>

                <button id="tombolKirim" onclick="kirimJawaban()" class="w-full bg-yellow-500 text-white px-6 py-4 rounded-2xl font-bold text-lg hover:bg-yellow-600 shadow-md transition-colors">
                    🚀 Kirim Jawaban
                </button>

                <div id="pesanHasil" class="hidden mt-4 p-4 rounded-xl border-2 text-center font-bold text-lg"></div>

                <button id="tombolLanjut" onclick="soalBerikutnya()" class="hidden w-full bg-green-500 text-white px-6 py-4 rounded-2xl font-bold text-lg hover:bg-green-600 shadow-md transition-colors mt-3">
                    ➡️ Lanjut
                </button>

            </div>

            <div id="hasilSkor" class="hidden mt-4 p-6 rounded-2xl border-4 border-yellow-300 bg-yellow-50 text-center hasil-box">
                <div class="text-5xl mb-2">🎉</div>
                <div class="sticker">⭐</div>
                <h2 class="text-2xl font-extrabold text-gray-800 mt-2">Selesai, Petualang!</h2>
                <div class="text-3xl font-extrabold text-yellow-600 mb-2">
                    <span id="skorBenar">0</span> dari <span id="skorTotal">0</span>
                    <span id="skorPersen" class="text-lg font-semibold text-gray-500">(0%)</span>
                </div>
                <div class="flex justify-center gap-6 text-sm text-gray-600 mb-3">
                    <div>✅ Benar: <span id="benarCount" class="font-bold text-green-600">0</span></div>
                    <div>❌ Salah: <span id="salahCount" class="font-bold text-red-600">0</span></div>
                </div>
                <div class="text-sm text-gray-500 mb-4">
                    💡 Poin yang didapat: <span id="skorPoinAkhir" class="font-bold text-yellow-600">0</span>
                </div>
                <div class="flex flex-wrap gap-3 justify-center">
                    <a href="sd.html" class="inline-block bg-yellow-600 text-white px-6 py-3 rounded-full font-bold hover:bg-yellow-700 transition shadow-md">
                        🏠 Kembali ke Dashboard
                    </a>
                    <button onclick="ulangi()" class="inline-block bg-indigo-500 text-white px-6 py-3 rounded-full font-bold hover:bg-indigo-600 transition shadow-md">
                        🔄 Ulangi
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ================================================================
        //  BANK SOAL INTERMEDIATE (12 Soal Campuran)
        //  Gambar yang sama dengan Advanced untuk kata kunci yang sama
        // ================================================================
        const bankSoal = [{
            tipe: "vocab",
            gambar: "https://images.unsplash.com/photo-1577896851231-70ef18881754?w=600&h=300&fit=crop&crop=center",
            soal: "What is the meaning of 'teacher'?",
            pilihan: ["Dokter", "Guru", "Polisi", "Petani"],
            kunci: 1,
            audio: null
        }, {
            tipe: "vocab",
            gambar: "https://images.unsplash.com/photo-1584820927498-cfe5211fd8bf?w=600&h=300&fit=crop&crop=center",
            soal: "What is the meaning of 'hospital'?",
            pilihan: ["Sekolah", "Rumah Sakit", "Kantor", "Pasar"],
            kunci: 1,
            audio: null
        }, {
            tipe: "vocab",
            gambar: "https://images.unsplash.com/photo-1519682337058-a94d519337bc?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D",
            soal: "What is the meaning of 'book'?",
            pilihan: ["Buku", "Pensil", "Meja", "Kursi"],
            kunci: 0,
            audio: null
        }, {
            tipe: "grammar",
            gambar: "https://images.unsplash.com/photo-1766898211726-5bdfa62a7143?w=600&h=300&fit=crop&crop=center",
            soal: "He ___ to school every day.",
            pilihan: ["go", "goes", "going", "went"],
            kunci: 1,
            audio: null
        }, {
            tipe: "grammar",
            gambar: "https://images.unsplash.com/photo-1622659097972-68f1d8c1829f?w=600&h=300&fit=crop&crop=center",
            soal: "We ___ playing football now.",
            pilihan: ["am", "is", "are", "be"],
            kunci: 2,
            audio: null
        }, {
            tipe: "grammar",
            gambar: "https://images.unsplash.com/photo-1648518295678-f78670c35924?q=80&w=1476&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D",
            soal: "I ___ a student.",
            pilihan: ["am", "is", "are", "be"],
            kunci: 0,
            audio: null
        }, {
            tipe: "listening",
            gambar: "https://images.unsplash.com/photo-1544716278-e513176f20b5?w=600&h=300&fit=crop&crop=center",
            soal: "Dengarkan dan pilih kata yang kamu dengar!",
            pilihan: ["Book", "Pencil", "Table", "Chair"],
            kunci: 0,
            audio: "Book"
        }, {
            tipe: "listening",
            gambar: "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600&h=300&fit=crop&crop=center",
            soal: "Dengarkan dan pilih kata yang kamu dengar!",
            pilihan: ["Sun", "Moon", "Star", "Cloud"],
            kunci: 2,
            audio: "Star"
        }, {
            tipe: "listening",
            gambar: "https://images.unsplash.com/photo-1574158622682-e40e69881006?w=600&h=300&fit=crop&crop=center",
            soal: "Dengarkan dan pilih kata yang kamu dengar!",
            pilihan: ["Cat", "Dog", "Bird", "Fish"],
            kunci: 0,
            audio: "Cat"
        }, {
            tipe: "reading",
            gambar: "ttps://images.unsplash.com/photo-1574158622682-e40e69881006?w=600&h=300&fit=crop&crop=center",
            soal: "Baca teks berikut! 'I have a white cat. It likes to sleep on the sofa.' Pertanyaan: Where does the cat sleep?",
            pilihan: ["On the bed", "On the sofa", "On the table", "On the floor"],
            kunci: 1,
            audio: null,
            bacaan: "I have a white cat. It likes to sleep on the sofa."
        }, {
            tipe: "reading",
            gambar: "https://images.unsplash.com/photo-1698993001180-8654ab29032a?w=600&h=300&fit=crop&crop=center",
            soal: "Baca teks berikut! 'Rani is 8 years old. She goes to SD Merdeka.' Pertanyaan: How old is Rani?",
            pilihan: ["6", "7", "8", "9"],
            kunci: 2,
            audio: null,
            bacaan: "Rani is 8 years old. She goes to SD Merdeka."
        }, {
            tipe: "reading",
            gambar: "https://images.unsplash.com/photo-1602088113235-229c19758e9f?w=600&h=300&fit=crop&crop=center",
            soal: "Baca teks berikut! 'Today is sunny. Many people go to the beach.' Pertanyaan: How is the weather?",
            pilihan: ["Rainy", "Cloudy", "Sunny", "Windy"],
            kunci: 2,
            audio: null,
            bacaan: "Today is sunny. Many people go to the beach."
        }];

        // ================================================================
        //  STATE & LOGIC
        // ================================================================
        let sesiSoal = [];
        let indeksAktif = 0;
        let poinSesi = 0;
        let pilihanDipilih = null;
        let statusRiwayat = {};
        const MAX_SOAL = 12;

        function acakSoal() {
            const shuffled = [...bankSoal];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled.slice(0, MAX_SOAL);
        }

        function muatSoal() {
            if (indeksAktif >= sesiSoal.length) { tampilkanSkor(); return; }
            const soal = sesiSoal[indeksAktif];
            const total = sesiSoal.length;
            document.getElementById("labelNomorSoal").innerHTML = "Soal " + (indeksAktif + 1) + " dari " + total;
            const progress = ((indeksAktif) / total) * 100;
            document.getElementById("progressFill").style.width = progress + "%";
            document.getElementById("progressLabel").innerHTML = Math.round(progress) + "%";
            const badgeMap = { vocab: '📝 Vocabulary', grammar: '📚 Grammar', listening: '🎧 Listening', reading: '📖 Reading' };
            document.getElementById("tipeSoalBadge").innerHTML = '<span class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full">' + badgeMap[soal.tipe] + '</span>';
            const imgEl = document.getElementById("gambarImg");
            if (soal.gambar) {
                imgEl.src = soal.gambar;
                imgEl.alt = "Gambar untuk soal";
                document.getElementById("gambarSoal").classList.remove("hidden");
            } else {
                document.getElementById("gambarSoal").classList.add("hidden");
            }
            const bacaanEl = document.getElementById("teksBacaan");
            if (soal.tipe === "reading" && soal.bacaan) {
                bacaanEl.classList.remove("hidden");
                bacaanEl.innerHTML = soal.bacaan;
            } else {
                bacaanEl.classList.add("hidden");
                bacaanEl.innerHTML = "";
            }
            const audioEl = document.getElementById("areaAudio");
            if (soal.tipe === "listening" && soal.audio) {
                audioEl.classList.remove("hidden");
            } else {
                audioEl.classList.add("hidden");
            }
            document.getElementById("teksSoal").innerHTML = soal.soal;
            const areaPilihan = document.getElementById("areaPilihan");
            areaPilihan.innerHTML = "";
            pilihanDipilih = null;
            soal.pilihan.forEach(function(opsi, index) {
                const tombol = document.createElement("button");
                tombol.innerHTML = opsi;
                tombol.id = "opsi-" + index;
                tombol.className = "option-btn";
                tombol.dataset.index = index;
                tombol.onclick = function() { pilihOpsi(index); };
                areaPilihan.appendChild(tombol);
            });
            document.getElementById("pesanHasil").classList.add("hidden");
            document.getElementById("tombolLanjut").classList.add("hidden");
            document.getElementById("tombolKirim").classList.remove("hidden");
            document.getElementById("hasilSkor").classList.add("hidden");
            const riwayat = statusRiwayat[indeksAktif];
            if (riwayat && riwayat.sudahBenar) {
                pilihanDipilih = riwayat.pilihan;
                tandaiTombolTerpilih(pilihanDipilih);
                tampilkanHasil(true, true);
                document.getElementById("tombolKirim").classList.add("hidden");
                if (indeksAktif < total - 1) {
                    document.getElementById("tombolLanjut").classList.remove("hidden");
                }
            } else {
                document.querySelectorAll(".option-btn").forEach(b => {
                    b.classList.remove("selected", "correct", "wrong", "disabled");
                });
            }
            const pesanMaskot = document.getElementById("pesanMaskot");
            const pesan = ["Ayo, jawab dengan teliti! 🧐", "Kamu pasti bisa! 💪", "Semangat! 🔥", "Coba pikirkan baik-baik! 🤔", "Selamat berpetualang! 🌟", "Lihat gambarnya, lalu pilih jawaban! 👀"];
            pesanMaskot.innerHTML = pesan[Math.floor(Math.random() * pesan.length)];
        }

        function pilihOpsi(index) {
            const riwayat = statusRiwayat[indeksAktif];
            if (riwayat && riwayat.sudahBenar) return;
            pilihanDipilih = index;
            tandaiTombolTerpilih(index);
        }

        function tandaiTombolTerpilih(index) {
            document.querySelectorAll(".option-btn").forEach((btn, i) => {
                btn.classList.remove("selected");
                if (i === index) btn.classList.add("selected");
            });
        }

        function kirimJawaban() {
            if (pilihanDipilih === null) { alert("Kak, pilih dulu jawabannya ya!"); return; }
            const soalAktif = sesiSoal[indeksAktif];
            const isBenar = (pilihanDipilih === soalAktif.kunci);
            if (isBenar) {
                if (!statusRiwayat[indeksAktif] || !statusRiwayat[indeksAktif].sudahBenar) {
                    poinSesi += 10;
                    document.getElementById("poinTotal").innerHTML = poinSesi;
                }
                statusRiwayat[indeksAktif] = { sudahBenar: true, pilihan: pilihanDipilih };
            } else {
                statusRiwayat[indeksAktif] = { sudahBenar: false, pilihan: pilihanDipilih };
            }
            tampilkanHasil(isBenar, false);
            document.getElementById("tombolKirim").classList.add("hidden");
            if (indeksAktif < sesiSoal.length - 1) {
                document.getElementById("tombolLanjut").classList.remove("hidden");
            } else {
                document.getElementById("tombolLanjut").textContent = "🎉 Lihat Hasil";
                document.getElementById("tombolLanjut").classList.remove("hidden");
                document.getElementById("tombolLanjut").onclick = function() { tampilkanSkor(); };
            }
        }

        function tampilkanHasil(isBenar, dariReview) {
            const soalAktif = sesiSoal[indeksAktif];
            const pesan = document.getElementById("pesanHasil");
            pesan.classList.remove("hidden");
            document.querySelectorAll(".option-btn").forEach((btn, i) => {
                btn.classList.add("disabled");
                if (i === soalAktif.kunci) btn.classList.add("correct");
                else if (i === pilihanDipilih && !isBenar) btn.classList.add("wrong");
            });
            const maskot = document.getElementById("pesanMaskot");
            if (isBenar) {
                pesan.innerHTML = dariReview ? '📚 <b>Kamu sudah jawab soal ini sebelumnya!</b>' : '🎉 <b>Benar sekali!</b> +10 poin ✨';
                pesan.className = "mt-4 p-4 rounded-xl border-2 border-green-200 bg-green-50 text-green-700 text-center font-bold text-lg";
                maskot.innerHTML = "Hebat! Kamu pintar! 🌟";
            } else {
                const jawabanBenar = soalAktif.pilihan[soalAktif.kunci];
                pesan.innerHTML = '😅 <b>Kurang tepat.</b> Jawaban yang benar: <span class="font-bold text-green-600">"' + jawabanBenar + '"</span>';
                pesan.className = "mt-4 p-4 rounded-xl border-2 border-red-200 bg-red-50 text-red-700 text-center font-bold text-lg";
                maskot.innerHTML = "Yuk, coba lebih teliti lagi! 💪";
            }
        }

        function soalBerikutnya() {
            indeksAktif++;
            muatSoal();
        }

        function tampilkanSkor() {
            const totalSoal = sesiSoal.length;
            let benar = 0;
            for (let i = 0; i < totalSoal; i++) {
                if (statusRiwayat[i] && statusRiwayat[i].sudahBenar) benar++;
            }
            const salah = totalSoal - benar;
            document.getElementById("hasilSkor").classList.remove("hidden");
            document.getElementById("skorBenar").innerHTML = benar;
            document.getElementById("skorTotal").innerHTML = totalSoal;
            document.getElementById("benarCount").innerHTML = benar;
            document.getElementById("salahCount").innerHTML = salah;
            document.getElementById("skorPoinAkhir").innerHTML = poinSesi;
            const persen = Math.round((benar / totalSoal) * 100);
            document.getElementById("skorPersen").innerHTML = "(" + persen + "%)";
            document.getElementById("areaSoal").classList.add("hidden");
            document.getElementById("tombolLanjut").classList.add("hidden");
            const poinLama = parseInt(localStorage.getItem('poinMurid')) || 0;
            localStorage.setItem('poinMurid', poinLama + poinSesi);
            document.getElementById("poinTotal").innerHTML = poinLama + poinSesi;
            let stiker = "⭐";
            if (persen === 100) stiker = "🏆";
            else if (persen >= 70) stiker = "🌟";
            else if (persen >= 50) stiker = "⭐";
            else stiker = "💪";
            document.querySelector(".sticker").innerHTML = stiker;
        }

        function ulangi() {
            sesiSoal = acakSoal();
            indeksAktif = 0;
            poinSesi = 0;
            statusRiwayat = {};
            document.getElementById("areaSoal").classList.remove("hidden");
            document.getElementById("hasilSkor").classList.add("hidden");
            document.getElementById("poinTotal").innerHTML = 0;
            muatSoal();
        }

        function putarAudio() {
            const soal = sesiSoal[indeksAktif];
            if (soal.audio) {
                const suara = new SpeechSynthesisUtterance(soal.audio);
                suara.lang = "en-US";
                suara.rate = 0.7;
                window.speechSynthesis.speak(suara);
            }
        }

        sesiSoal = acakSoal();
        indeksAktif = 0;
        poinSesi = 0;
        statusRiwayat = {};
        document.getElementById("poinTotal").innerHTML = parseInt(localStorage.getItem('poinMurid')) || 0;
        muatSoal();
    </script>
